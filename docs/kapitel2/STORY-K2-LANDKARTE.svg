  <text class="s" x="236" y="375" text-anchor="end">Fährmann, Feuer, Händler,</text>
  <text class="s" x="236" y="389" text-anchor="end">Aushang mit Höhlenaufträgen</text>
  <!-- Höhle 2: Lehmhang -->
  <path d="M316 360 L384 360" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="5 4"/>
