<svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:var(--body);fill:var(--fg)}.t{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--gold)}.s{font-size:10.5px;fill:var(--muted)}.h{font-family:var(--display);font-weight:700;font-size:12.5px;fill:var(--gold)}</style>
  <rect x="0" y="0" width="600" height="760" fill="#17150f"/>
  <!-- Bornim -->
  <rect x="226" y="20" width="108" height="96" fill="#2b2618" stroke="#7d6630" stroke-dasharray="3 3"/>
