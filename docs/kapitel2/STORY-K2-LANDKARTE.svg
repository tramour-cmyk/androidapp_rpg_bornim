  <!-- Aschfurt -->
  <path d="M320 600 C300 625 262 642 230 655" stroke="#c9a24a" stroke-width="3" fill="none"/>
  <rect x="140" y="640" width="90" height="90" fill="#3a3330" stroke="#c9a24a"/>
