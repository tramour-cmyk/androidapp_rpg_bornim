  <text class="s" x="202" y="466" text-anchor="middle">Worgs · frei: Eulenbär</text>
  <text class="t" x="324" y="528" text-anchor="middle">Kultlager</text>
  <text class="s" x="324" y="544" text-anchor="middle">Gefangene,</text>
  <text class="s" x="324" y="558" text-anchor="middle">Gwennas Mann</text>
  <text class="s" x="80" y="596" text-anchor="middle">je 40×50 · Stufe 5</text>
  <text class="t" x="20" y="622">Das Graumoor</text>
  <!-- Wege im Moor -->
  <path d="M280 430 C280 500 140 505 90 532 C70 555 110 570 160 562 C210 554 250 566 290 584 C305 590 315 595 320 600" stroke="#c9a24a" stroke-width="3" fill="none"/>
