name: Chefsache Übersicht

# Schreibt docs/chefsache/README.md (Übersicht „Chefsache“, 108) aus den Dateien in docs/chefsache/ neu, sobald sich dort etwas ändert.
# Keine Sitzung bearbeitet die README von Hand, darum gibt es keine Konflikte (D15.3). Pushes mit dem Actions-Schlüssel
# starten keine weiteren Workflows, also auch keinen APK-Build.
on:
  push:
    branches: [main]
    paths:
      - "docs/chefsache/**"
      - "tools/zug-index.py"
      - "docs/ARBEIT-*.md"  # D21.3: Lücken (wartet auf Chef ohne Datei)
      - "docs/LISTE-VORGAENGE.md"  # Vorrang und Bereich (124, 126, 136)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zug-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Übersicht schreiben und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for versuch in 1 2 3 4; do
            git pull -q --rebase origin main
            python3 tools/zug-index.py
            git diff --quiet docs/chefsache/README.md && exit 0
            git commit -qm "Chefsache: Übersicht" docs/chefsache/README.md
            git push -q origin HEAD:main && exit 0
            git reset -q --hard origin/main
            sleep $((versuch * 3))
          done
          exit 1
