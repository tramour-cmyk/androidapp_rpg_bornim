name: Tom Probefilm (431, 416.4, 376.1)

# 431, 416.4 (Tom 01.11.; Sokrates 01.11., Chefsache 416.4a: Kaufmodelle nur über einen Ablauf auf GitHub, nie in eine Sitzung):
# Probefilm aus der Bibliothek (godot/probe/drehfilm.gd) ohne APK. Welcher Film: erste Nummer der Commit-Nachricht (431 oder 416.4)
# oder Eingabe beim Start von Hand. Gekaufte Dateien bleiben auf dem Runner; ins Artefakt gehen nur Film und Protokoll (348.12c a).
on:
  push:
    branches: ["claude/tom-431-**", "claude/tom-416-4-**", "claude/tom-376-1-heldin"]
    paths: ["godot/probe/**", "godot/tests/drehfilm_431.gd", ".github/workflows/tom-probe.yml"]
  workflow_dispatch:
    inputs:
      film:
        description: "431, 431v, 416.4 oder 376.1"
        required: true
        default: "431"

jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - name: Welcher Film
        env:
          NACHRICHT: ${{ github.event.head_commit.message }}
          EINGABE: ${{ github.event.inputs.film }}
        run: |
          F="$EINGABE"
          [ -n "$F" ] || F=$(printf '%s' "$NACHRICHT" | grep -oE '^(416\.4|431v|431|376\.1)' | head -1)
          [ -n "$F" ] || { echo "Commit beginnt nicht mit 431, 416.4 oder 376.1"; exit 1; }
          echo "FILM=$F" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          [ -d templates ] || { curl -sSL -o t.tpz $base/Godot_v$GODOT-stable_export_templates.tpz && unzip -q t.tpz && rm t.tpz; }
          ~/godot/godot --version
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-3
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Gekaufte Grundkörper und Trachten (privat, nur Quaternius Source)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
          MUSTER: "Universal.Base.Characters.Source.zip Modular.Character.Outfits.-.Fantasy.Source.zip"
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          timeout 900 bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf > kauf.log 2>&1 || { tail -20 kauf.log; exit 1; }
          grep -E "FullBody\.gltf|Rigged to Head Bone.*\.gltf" kauf.log | grep -v "\.bin" | head -60 || true
      # 431v (Völker Runde 3): Grundkörper je Volk in Blender (voelker.py, Knochenlängen nach Homers Zielen, gemessen), Goblin zum
      # Vergleich (Jerrys goblin.py); beides nur auf dem Runner
      - uses: actions/setup-python@v5
        if: env.FILM == '431v'
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        if: env.FILM == '431v'
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}-py${{ steps.py.outputs.python-version }}
      - name: Völker bauen (431v)
        if: env.FILM == '431v'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          [ -x bl/bin/python ] || { rm -rf bl; python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
          mkdir -p $GITHUB_WORKSPACE/filme
          export VOELKER=$RUNNER_TEMP/voelker; echo "VOELKER=$VOELKER" >> $GITHUB_ENV
          Q=~/cc0 ZIEL=$VOELKER timeout 1500 bl/bin/python -I tools/blender348/v3/voelker.py > $GITHUB_WORKSPACE/filme/voelker.log 2>&1 || { tail -40 $GITHUB_WORKSPACE/filme/voelker.log; exit 1; }
          grep -E "^(LADEN|RUNDE|VOELKER)" $GITHUB_WORKSPACE/filme/voelker.log | cut -c1-300
          cp $VOELKER/voelker.json $GITHUB_WORKSPACE/filme/
          # Goblin (Jerry, Kit Leder) zum Vergleich mit dem Hügelvolk; fehlt er, zeigt der Film den Teil ohne ihn
          export OUT=$RUNNER_TEMP/out KARTEN=$GITHUB_WORKSPACE/godot/daten/karten.json
          { bl/bin/python -I tools/blender348/v3/tex.py > tex.log 2>&1 && ART=goblin KIT=leder V3=tools/blender348/v3_kampf timeout 900 bl/bin/python -I tools/blender348/goblin.py > goblin.log 2>&1 \
            && cp $OUT/goblin-leder.glb $VOELKER/goblin.glb; } || { echo "ohne Goblin"; tail -15 tex.log goblin.log; }
          ls -l $VOELKER
          echo "Ohren, Hauer im Bestand (408):"; find $KAUF ~/cc0 \( -iname '*ear*' -o -iname '*tusk*' -o -iname '*fang*' \) -not -iname '*year*' -not -iname '*gear*' -not -iname '*wear*' 2>/dev/null | grep -v '\.png$' | head -20 || true
      - name: Film
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          command -v ffmpeg > /dev/null || { python3 -m pip install -q imageio-ffmpeg && mkdir -p ~/ffbin && ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/ffbin/ffmpeg; export PATH=~/ffbin:$PATH; }
          mkdir -p $GITHUB_WORKSPACE/filme
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          export CC0=$HOME/cc0
          timeout 900 xvfb-run -a -s "-screen 0 1080x2340x24" ~/godot/godot --rendering-driver opengl3 --path . res://probe/drehfilm.tscn \
            --resolution 1080x2340 --write-movie $RUNNER_TEMP/film.avi --fixed-fps 30 -- --film=$FILM > $GITHUB_WORKSPACE/filme/film-$FILM.log 2>&1 || true
          grep -E "^FILM|SCRIPT ERROR|^ +at: " $GITHUB_WORKSPACE/filme/film-$FILM.log | cut -c1-400 | head -80
          ffmpeg -loglevel error -y -i $RUNNER_TEMP/film.avi -c:v libx264 -pix_fmt yuv420p -crf 26 -preset veryfast -movflags +faststart $GITHUB_WORKSPACE/filme/$FILM-probe.mp4
          ls -l $GITHUB_WORKSPACE/filme
          ! grep -qE "SCRIPT ERROR|FILM FEHLER" $GITHUB_WORKSPACE/filme/film-$FILM.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bornim-probefilm
          path: filme/
          if-no-files-found: ignore
