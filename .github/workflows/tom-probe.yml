name: Tom Probefilm (431, 416.4)

# 431, 416.4 (Tom 01.11.; Sokrates 01.11., Chefsache 416.4a: Kaufmodelle nur über einen Ablauf auf GitHub, nie in eine Sitzung):
# Probefilm aus der Bibliothek (godot/probe/drehfilm.gd) ohne APK. Welcher Film: erste Nummer der Commit-Nachricht (431 oder 416.4)
# oder Eingabe beim Start von Hand. Gekaufte Dateien bleiben auf dem Runner; ins Artefakt gehen nur Film und Protokoll (348.12c a).
on:
  push:
    branches: ["claude/tom-431-**", "claude/tom-416-4-**"]
    paths: ["godot/probe/**", "godot/tests/drehfilm_431.gd", ".github/workflows/tom-probe.yml"]
  workflow_dispatch:
    inputs:
      film:
        description: "431 oder 416.4"
        required: true
        default: "431"

jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - name: Welcher Film
        env:
          NACHRICHT: ${{ github.event.head_commit.message }}
          EINGABE: ${{ github.event.inputs.film }}
        run: |
          F="$EINGABE"
          [ -n "$F" ] || F=$(printf '%s' "$NACHRICHT" | grep -oE '^(416\.4|431)' | head -1)
          [ -n "$F" ] || { echo "Commit beginnt nicht mit 431 oder 416.4"; exit 1; }
          echo "FILM=$F" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          [ -d templates ] || { curl -sSL -o t.tpz $base/Godot_v$GODOT-stable_export_templates.tpz && unzip -q t.tpz && rm t.tpz; }
          ~/godot/godot --version
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-3
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Gekaufte Grundkörper (privat, nur Universal Base Characters Source)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
          MUSTER: "Universal.Base.Characters.Source.zip"
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          timeout 900 bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf > kauf.log 2>&1 || { tail -20 kauf.log; exit 1; }
          grep -E "FullBody\.gltf|Rigged to Head Bone.*\.gltf" kauf.log | grep -v "\.bin" | head -60 || true
      - name: Film
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          command -v ffmpeg > /dev/null || { python3 -m pip install -q imageio-ffmpeg && mkdir -p ~/ffbin && ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/ffbin/ffmpeg; export PATH=~/ffbin:$PATH; }
          mkdir -p $GITHUB_WORKSPACE/filme
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          export CC0=$HOME/cc0
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --rendering-driver opengl3 --path . res://probe/drehfilm.tscn \
            --resolution 1280x720 --write-movie $RUNNER_TEMP/film.avi --fixed-fps 30 -- --film=$FILM > $GITHUB_WORKSPACE/filme/film-$FILM.log 2>&1 || true
          grep -E "^FILM|SCRIPT ERROR|^ +at: " $GITHUB_WORKSPACE/filme/film-$FILM.log | cut -c1-400 | head -80
          ffmpeg -loglevel error -y -i $RUNNER_TEMP/film.avi -c:v libx264 -pix_fmt yuv420p -crf 26 -preset veryfast -movflags +faststart $GITHUB_WORKSPACE/filme/$FILM-probe.mp4
          ls -l $GITHUB_WORKSPACE/filme
          ! grep -qE "SCRIPT ERROR|FILM FEHLER" $GITHUB_WORKSPACE/filme/film-$FILM.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bornim-probefilm
          path: filme/
          if-no-files-found: ignore
