name: Tom Probe Voelker (431)

# 431 Runde 3 (Chef 01.11., 11:42, „431 wie Sokrates“; Hinweis Sokrates 11:4x: Probe wie gebaut, mit Toon-Licht und Tusche): Grundkoerper
# je Volk (voelker.py) im Spiel gefilmt (figurenprobe --teil=voelker, voelkerprobe.gd), Zahlen dazu (voelker_film.py). Kaufmodelle nur
# ueber diesen Ablauf, nie in eine Sitzung (416.4a); ins Artefakt nur Film, Masse, Protokolle (348.12c a). Nur bei Commits, die mit
# „431“ beginnen, oder von Hand. Dritter Lauf freigegeben (431a, Chef 01.11., 12:56: danach Film an den Chef, egal wie er ausfällt).
# Runde 4 (Chef 01.11., 20:3x; 431b 02.11., 11:17): Merkmale (merkmale.py), Haltung, Hautfarbe, Zwerghaar, Familie neben Goblin und Grak.
on:
  push:
    branches: ["claude/tom-431-**"]
    paths: ["godot/skripte/voelkerprobe.gd", "tools/blender348/v3/voelker.py", "tools/blender348/v3/merkmale.py", "tools/blender348/v3/voelker_film.py", ".github/workflows/tom-probe-431.yml"]
  workflow_dispatch:
    inputs:
      rechnung:
        description: "nur Hautrechnung ohne Bild (431c B1, voelker_haut_rechnung.py), kein Film"
        type: boolean
        default: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '431')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Karten und Texte aus core (wie godot.yml)
        run: |
          ./gradlew -p core exportMaps -Pout=$GITHUB_WORKSPACE/godot/daten/karten.json -q
          ./gradlew -p core exportTexts -Pout=$GITHUB_WORKSPACE/godot/daten/texte.json -q
          ./gradlew -p core exportHero -Pout=$GITHUB_WORKSPACE/godot/daten/held.json -q
          ./gradlew -p core exportIntro -Pout=$GITHUB_WORKSPACE/godot/daten/intro.json -q
          mkdir -p godot/daten/intro && for f in app/src/main/assets/intro/*.jpg app/src/main/assets/intro/*.png app/src/main/assets/tempel/*.jpg; do b=$(basename $f); cp $f godot/daten/intro/${b%.*}.bild; done
          cp godot/bilder/logo-quer.svg godot/daten/logo.bild
          ./gradlew -p core exportMapSheets -Pout=$GITHUB_WORKSPACE/godot/daten -q
          ./gradlew -p core exportThingArt -Pout=$GITHUB_WORKSPACE/godot/daten -q
          cp app/src/main/res/font/fondamento_regular.ttf godot/daten/fondamento.ttf
          cp app/src/main/assets/menu/hauptmenue.jpg godot/daten/hauptmenue.bild
      - name: Gekaufte Modelle (privat)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          timeout 1200 bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf > kauf.log 2>&1 || { tail -20 kauf.log; exit 1; }
          wc -l kauf.log
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}-py${{ steps.py.outputs.python-version }}
      - name: Blender als Python-Modul
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          [ -x bl/bin/python ] || { rm -rf bl; python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-4
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/medieval-village-megakit ] || PAKETE=medieval-village-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/stylized-nature-megakit ] || PAKETE=stylized-nature-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/fantasy-props-megakit ] || PAKETE=fantasy-props-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Modelle bauen (Held, Dorf; wie godot.yml)
        run: |
          export OUT=$RUNNER_TEMP/out KARTEN=$GITHUB_WORKSPACE/godot/daten/karten.json
          for s in tex held3 rig dorf; do
            bl/bin/python -I tools/blender348/v3/$s.py > $s.log 2>&1 || { tail -40 $s.log; exit 1; }
          done
          D=godot/daten
          cp $OUT/held.glb $D/held.bin && cp $OUT/held-info.json $D/
          cp $OUT/dorf.glb $D/dorf.bin && cp $OUT/dorf-info.json $D/
          for t in gras erde pflaster halme korn weiss; do cp $OUT/tex/$t.png $D/$t.bild; done
          cp $OUT/boden-maske.png $D/boden-maske.bild
      - name: Held (Bewegungen, 376.1, gekauft), Voelker (431), Goblin
        run: |
          export OUT=$RUNNER_TEMP/out
          OUT=$RUNNER_TEMP/out ZIEL=$RUNNER_TEMP/klassen Q=~/cc0 KLASSEN=FIGHTER bl/bin/python -I tools/blender348/v3/held_klassen.py > klassen.log 2>&1 || { tail -40 klassen.log; exit 1; }
          D=godot/daten
          for f in $RUNNER_TEMP/klassen/held_*.glb; do cp $f $D/$(basename $f .glb).bin; done
          cp $RUNNER_TEMP/klassen/haare.glb $D/haare.bin && cp $RUNNER_TEMP/klassen/haare_w.glb $D/haare_w.bin && cp $RUNNER_TEMP/klassen/bewegungen.glb $D/bewegungen.bin && cp $RUNNER_TEMP/klassen/held-klassen.json $D/
          mkdir -p $GITHUB_WORKSPACE/probe
          V=$RUNNER_TEMP/voelker; echo "VOELKER=$V" >> $GITHUB_ENV
          Q=~/cc0 ZIEL=$V timeout 1800 bl/bin/python -I tools/blender348/v3/voelker.py > $GITHUB_WORKSPACE/probe/voelker.log 2>&1 || { tail -40 $GITHUB_WORKSPACE/probe/voelker.log; exit 1; }
          grep -E "^(RUNDE|BESTE|VOELKER)" $GITHUB_WORKSPACE/probe/voelker.log | cut -c1-200
          grep -E "^MERKMALE" $GITHUB_WORKSPACE/probe/voelker.log | cut -c1-900
          grep -E "^KNIE" $GITHUB_WORKSPACE/probe/voelker.log | sort | uniq -c | sort -rn | head -8 | cut -c1-200
          cp $V/voelker.json $GITHUB_WORKSPACE/probe/
          { ART=goblin KIT=leder V3=tools/blender348/v3_kampf timeout 900 bl/bin/python -I tools/blender348/goblin.py > goblin.log 2>&1 && cp $OUT/goblin-leder.glb $V/goblin.glb; } || { echo "ohne Goblin"; tail -15 goblin.log; }
          # 431b: Grak daneben (grak_gestalt.py wie godot-kampf.yml; Axt aus waffen.py); fehlt etwas, ohne Grak
          { OUT=$RUNNER_TEMP/out timeout 600 bl/bin/python -I tools/blender348/waffen.py > waffen.log 2>&1 && \
            OUT=$RUNNER_TEMP/grak CC0=$HOME/cc0 WAFFEN=$RUNNER_TEMP/out timeout 1500 bl/bin/python -I tools/blender348/grak_gestalt.py > grak.log 2>&1 && \
            cp $RUNNER_TEMP/grak/grak-gestalt.glb $V/grak.glb; } || { echo "ohne Grak"; tail -15 waffen.log grak.log 2>/dev/null; }
          echo "Ohren, Hauer im Bestand (408):"; find $KAUF ~/cc0 \( -iname '*ear*' -o -iname '*tusk*' -o -iname '*fang*' \) -not -iname '*year*' -not -iname '*gear*' -not -iname '*wear*' 2>/dev/null | grep -v '\.png$' | head -20 || true
          ls -l $V
      - name: Hautrechnung ohne Bild (431c B1)
        if: inputs.rechnung
        run: bl/bin/python -I tools/blender348/v3/voelker_haut_rechnung.py $VOELKER godot/daten 2>&1 | tee probe/haut_rechnung.txt
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          ~/godot/godot --version
      - name: Hautwerte in Godot ohne Bild (431c B1, tests/haut_431.gd)
        if: inputs.rechnung
        run: |
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          timeout 300 ~/godot/godot --headless --path . -s res://tests/haut_431.gd 2>&1 | grep -E "HAUT431|SCRIPT ERROR|ERROR" | tee $GITHUB_WORKSPACE/probe/haut_godot.txt
      - name: Film
        if: ${{ !inputs.rechnung }}
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          command -v ffmpeg > /dev/null || { python3 -m pip install -q imageio-ffmpeg && mkdir -p ~/ffbin && ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/ffbin/ffmpeg; }
          export PATH=~/ffbin:$PATH
          A=$RUNNER_TEMP/aus; mkdir -p $A
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          timeout 2400 xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --rendering-driver opengl3 --path . --resolution 1080x720 \
            -- --figuren=$A --teil=voelker > $GITHUB_WORKSPACE/probe/probe.log 2>&1 || true
          grep -E "^(VOLK|TEIL|FEHLT|HAUER|ZWERGHAAR|HAUTBILD)|SCRIPT ERROR" $GITHUB_WORKSPACE/probe/probe.log | cut -c1-300 | head -60
          cp $A/probe.txt $A/voelker/lage.json $GITHUB_WORKSPACE/probe/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE
          bl/bin/python -I tools/blender348/v3/voelker_film.py $A/voelker godot/kampf/schrift/alegreya_regular.ttf $RUNNER_TEMP/seiten
          ffmpeg -loglevel error -y -framerate 30 -i $RUNNER_TEMP/seiten/%04d.png -c:v libx264 -pix_fmt yuv420p -crf 24 -preset veryfast -movflags +faststart probe/431-voelker.mp4
          cp $RUNNER_TEMP/seiten/0000.png probe/431-seite1.png; cp $RUNNER_TEMP/seiten/0180.png probe/431-seite1-halb.png 2>/dev/null || true
          ls -l probe
          ! grep -q "SCRIPT ERROR" probe/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bornim-probe-431
          path: probe/
          if-no-files-found: ignore
