name: Werkzeugtests (1775)

# 1775 (Diogenes D329.1 zu 1771): die Werkzeugtests liefen nur im Job kerntest-main von godot.yml, der nur bei Änderungen
# unter godot/** u. a. startet; eine Änderung nur an den Werkzeugen (tools/*.py, *.sh, kernregeln.txt) blieb ungetestet.
# Hier auf main bei jeder Änderung an tools/ (oberste Ebene) oder dieser Datei; ohne Godot, etwa 10 s.
on:
  push:
    branches: ["main"]
    paths: ["tools/*.py", "tools/*.sh", "tools/*.txt", "tools/umstellung1727/*.py", ".github/workflows/werkzeuge.yml", ".github/workflows/herzschlag.yml", ".github/workflows/herzschlag-kette.yml"]
  workflow_dispatch:

concurrency:
  group: werkzeuge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  werkzeugtests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # 1765, 1771: Übergabe (1760), Chefwort (1762), Rückmeldung (1763), Telegram-Regel (1739), Auftrag
      - name: Werkzeugtests (Übergabe, Chefwort, Rückmeldung, Meldung, Auftrag, Zweig doppelt)
        run: |
          git config --global user.email "ci@bornim" && git config --global user.name "ci"
          python3 tools/uebergabe_test.py
          python3 tools/chefwort_test.py
          python3 tools/rueckmeldung_test.py
          python3 tools/liste_neu_test.py
          python3 tools/meldung_regel_test.py
          python3 tools/auftrag_test.py
          python3 tools/zweig_doppelt_test.py   # 1776
          python3 tools/laufbremse_test.py      # 1777 (Spike, 1766)
          python3 tools/sperre-haken.py --test  # 1739 Sperre Force-Push, Keystore
          python3 tools/buildzweig-haken.py --test
          python3 tools/gepusht-haken.py --test # 1739 Stop-Haken alles gepusht
          python3 tools/rufname_test.py         # 1739 Rufnamen (lauf.py nur scharf, kosten.py)
          python3 tools/gegengelesen_test.py    # 1783 Gegengelesen mit Rufnamen
          python3 tools/kostenbericht_test.py   # 1739 Kosten in drei Teilen
          python3 tools/lehren_test.py          # 1739 Lehrenbuch
          python3 tools/lieferung_test.py       # 1739 wartet auf leeren bei Lieferung
          python3 tools/tagesbericht_test.py    # 1739 Tagesbericht: Wo stehen wir, Fristen
          python3 tools/herzschlag.py --test    # 1788 (1764) Herzschlag
          python3 tools/ladesumme_test.py       # 1739 Größen und Ladesumme
          python3 tools/projektplan_test.py     # 1860 Themenblöcke statt Wochenziel
          python3 tools/rundblick_test.py       # 1789 Rundblick-Start ohne Kern, Ausnahme „Zurück“
          python3 tools/nachtstarts_test.py     # 1792 Nachtstopp mit Ausnahme aus Chefentscheid
          python3 tools/liegt_test.py           # 1799 LIEGT nach Grobablauf 14.2
          python3 tools/guthaben_test.py        # 1804 Guthabenstufe und Laufsperre
          python3 tools/umstellung1727_test.py  # 1739 Umstellung Vorgangsliste (an Kopie)
