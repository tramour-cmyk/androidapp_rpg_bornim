name: Tom Probe Tragart (417)

# Runde 5 (Pruefer 13:3x): Griff nach den Unity-Prefabs der Pakete (griff417b.py), Messung tests/tragen_pakete_417.gd, Film wie im Spiel
# mit Anlaufen und Anhalten (416.4).
# Runde 4 (Chef 01.11., 12:21: Axt Runde 3 „schwebt“; 348.12c Pakete): Gehen und Rennen je Waffe aus den Protofactor-Paketen
# (waffengang.py), Kaempfer mit Kriegsaxt, Langschwert, Langschwert und Rundschild, Schurke mit Kurzbogen, im Tempo des Spiels
# (tragprobe --teil=tragenpakete). Runde 3 (Axt in drei Fassungen) bleibt im Verlauf.

# 417 Runde 3 (Chef 01.11., 11:32: „der Axtkopf muss nach unten“, „ein bisschen weiter nach vorne ziehen“): die Kriegsaxt in drei
# Fassungen (tragprobe.gd AXT_FASSUNGEN) als Film von der Seite und Blatt, dazu die Messung tests/tragen_417.gd. Kaufmodelle nur ueber
# einen Ablauf auf GitHub, nie in eine Sitzung (Chefsache 416.4a); gekaufte Dateien bleiben auf dem Runner, ins Artefakt gehen nur
# Bilder, Film und Protokolle (348.12c a). Nur bei Commits, die mit „417“ beginnen, oder von Hand.
on:
  push:
    branches: ["claude/tom-417-**"]
    paths: ["godot/skripte/tragen.gd", "godot/skripte/tragprobe.gd", "godot/skripte/heldfigur.gd", "godot/tests/tragen_417.gd", "godot/tests/tragen_pakete_417.gd", ".github/workflows/tom-probe-417.yml"]
  workflow_dispatch:
    inputs:
      bild:
        description: "Bilder und Film (ja) oder nur Messung ohne Bild (nein, 390a)"
        default: "ja"

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '417')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Karten und Texte aus core (wie godot.yml)
        run: |
          ./gradlew -p core exportMaps -Pout=$GITHUB_WORKSPACE/godot/daten/karten.json -q
          ./gradlew -p core exportTexts -Pout=$GITHUB_WORKSPACE/godot/daten/texte.json -q
          ./gradlew -p core exportHero -Pout=$GITHUB_WORKSPACE/godot/daten/held.json -q
          ./gradlew -p core exportIntro -Pout=$GITHUB_WORKSPACE/godot/daten/intro.json -q
          mkdir -p godot/daten/intro && for f in app/src/main/assets/intro/*.jpg app/src/main/assets/intro/*.png app/src/main/assets/tempel/*.jpg; do b=$(basename $f); cp $f godot/daten/intro/${b%.*}.bild; done
          cp godot/bilder/logo-quer.svg godot/daten/logo.bild
          ./gradlew -p core exportMapSheets -Pout=$GITHUB_WORKSPACE/godot/daten -q
          ./gradlew -p core exportThingArt -Pout=$GITHUB_WORKSPACE/godot/daten -q
          cp app/src/main/res/font/fondamento_regular.ttf godot/daten/fondamento.ttf
          cp app/src/main/assets/menu/hauptmenue.jpg godot/daten/hauptmenue.bild
      - name: Gekaufte Modelle (privat)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          timeout 1200 bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf > kauf.log 2>&1 || { tail -20 kauf.log; exit 1; }
          wc -l kauf.log
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}-py${{ steps.py.outputs.python-version }}
      - name: Blender als Python-Modul
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          [ -x bl/bin/python ] || { rm -rf bl; python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-4
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/medieval-village-megakit ] || PAKETE=medieval-village-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/stylized-nature-megakit ] || PAKETE=stylized-nature-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/fantasy-props-megakit ] || PAKETE=fantasy-props-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Modelle bauen (Held, Dorf; wie godot.yml)
        run: |
          export OUT=$RUNNER_TEMP/out KARTEN=$GITHUB_WORKSPACE/godot/daten/karten.json
          for s in tex held3 rig dorf; do
            bl/bin/python -I tools/blender348/v3/$s.py > $s.log 2>&1 || { tail -40 $s.log; exit 1; }
          done
          D=godot/daten
          cp $OUT/held.glb $D/held.bin && cp $OUT/held-info.json $D/
          cp $OUT/dorf.glb $D/dorf.bin && cp $OUT/dorf-info.json $D/
          for t in gras erde pflaster halme korn weiss; do cp $OUT/tex/$t.png $D/$t.bild; done
          cp $OUT/boden-maske.png $D/boden-maske.bild
      - name: Waffengang aus den Paketen (417 Runde 4)
        run: |
          Z=$(find $KAUF -path '*Unreal-Godot*' -name UAL1.glb | sort | head -1); [ -n "$Z" ] || Z=$(find ~/cc0 -name UAL1_Standard.glb | sort | head -1)
          KAUF=$KAUF ZIEL=$Z OUT=$RUNNER_TEMP/gang BL=$GITHUB_WORKSPACE/bl/bin/python bl/bin/python -I tools/blender348/v3/waffengang.py > gang.log 2>&1 || { tail -30 gang.log; exit 1; }
          grep -E "^(GANG|FEHLT|MESS|NEIGUNG|AUFRICHTEN|BODEN|WAFFENGANG)" gang.log | sed "s|$KAUF/||g" | cut -c1-300
      - name: Kaempfer und Schurke (376.1, gekauft), Waffen
        run: |
          GANG=$RUNNER_TEMP/gang OUT=$RUNNER_TEMP/out ZIEL=$RUNNER_TEMP/klassen Q=~/cc0 KLASSEN=FIGHTER,ROGUE bl/bin/python -I tools/blender348/v3/held_klassen.py > klassen.log 2>&1 || { tail -40 klassen.log; exit 1; }
          grep -E "^KLASSE|HELD KLASSEN|FEHLT" klassen.log || true
          D=godot/daten
          for f in $RUNNER_TEMP/klassen/held_*.glb; do cp $f $D/$(basename $f .glb).bin; done
          cp $RUNNER_TEMP/klassen/haare.glb $D/haare.bin && cp $RUNNER_TEMP/klassen/bewegungen.glb $D/bewegungen.bin && cp $RUNNER_TEMP/klassen/held-klassen.json $D/
          mkdir -p $D/waffen
          OUT=$RUNNER_TEMP/waffen WAFFE=greataxe-grak bl/bin/python -I tools/blender348/waffen.py > waffe.log 2>&1 || { tail -30 waffe.log; exit 1; }
          cp $RUNNER_TEMP/waffen/greataxe-grak.glb $D/waffen/greataxe.bin   # Kriegsaxt = Graks Axt aus waffen.py (Farben neu)
          for w in longsword round_shield shortbow; do
            OUT=$RUNNER_TEMP/waffen WAFFE=$w bl/bin/python -I tools/blender348/waffen.py > waffe-$w.log 2>&1 && cp $RUNNER_TEMP/waffen/$w.glb $D/waffen/$w.bin || echo "keine Waffe $w"
          done
          ls -l $D/held_*.bin $D/waffen
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          ~/godot/godot --version
      - name: Messung (tragen_417)
        run: |
          mkdir -p $GITHUB_WORKSPACE/probe
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          set -o pipefail
          timeout 120 ~/godot/godot --headless --path . -s res://tests/skripte_pruefen.gd 2>&1 | grep -E "SKRIPTE|FALSCH|SCRIPT ERROR|Parse Error" | tee $GITHUB_WORKSPACE/probe/skripte.log || true
          timeout 900 ~/godot/godot --headless --path . -s res://tests/tragen_pakete_417.gd 2>&1 | grep -E "^(MESS|ORT|FASSUNG|FEHLER|PAKETE|GLEIT|FILMNACH|FILMBILD|HALTUNG|AXTGRIFF)|SCRIPT ERROR|^ +at: " | cut -c1-600 | tee $GITHUB_WORKSPACE/probe/messung.log || true   # Runde 5: Waffen der Pakete
      - name: Bilder und Film
        if: always() && inputs.bild != 'nein'
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick > /dev/null
          command -v ffmpeg > /dev/null || { python3 -m pip install -q imageio-ffmpeg && mkdir -p ~/ffbin && ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/ffbin/ffmpeg; }
          export PATH=~/ffbin:$PATH
          A=$RUNNER_TEMP/aus; mkdir -p $A $GITHUB_WORKSPACE/probe
          cp $GITHUB_WORKSPACE/gang.log $GITHUB_WORKSPACE/probe/ 2>/dev/null && sed -i "s|$KAUF/||g" $GITHUB_WORKSPACE/probe/gang.log || true
          cd godot
          timeout 1500 xvfb-run -a -s "-screen 0 1080x2340x24" ~/godot/godot --rendering-driver opengl3 --path . --resolution 600x800 \
            -- --figuren=$A --teil=tragenpakete > $GITHUB_WORKSPACE/probe/probe.log 2>&1 || true
          grep -E "^(GANG|BILDER|FILM|FILMGLEIT|KLASSE|FEHLT)|SCRIPT ERROR|^ +at: " $GITHUB_WORKSPACE/probe/probe.log | cut -c1-400 | head -60
          cp $A/probe.txt $GITHUB_WORKSPACE/probe/ 2>/dev/null || true
          cd $A
          F="FIGHTER_axt FIGHTER_einhand FIGHTER_schild ROGUE_bogen"
          # Blatt: je Waffe eine Zeile: Gehen von der Seite (zwei Phasen), Rennen von der Seite (zwei Phasen), Rennen von hinten, Spielansicht
          for f in $F; do
            montage -label "$f · Gehen" tragen/${f}_Gehen_0_rechts.png -label "Gehen" tragen/${f}_Gehen_2_rechts.png \
              -label "Rennen" tragen/${f}_Rennen_0_rechts.png -label "Rennen" tragen/${f}_Rennen_2_rechts.png -label "Rennen, hinten" tragen/${f}_Rennen_0_hinten.png \
              -label "Spielansicht" tragen/${f}_Rennen_0_spiel.png \
              -tile 6x1 -geometry 300x400+3+3 -background black -fill '#d4af37' -pointsize 18 zeile_$f.png
          done
          montage $(for f in $F; do echo zeile_$f.png; done) -tile 1x4 -geometry +0+0 -background black $GITHUB_WORKSPACE/probe/417-pakete-blatt.png
          # Film: Waffen im Raster 3x2, Bild fuer Bild (Gehen, dann Rennen; kuerzere Felder stehen am Ende still); Pruefer 00:53: Axt und
          # Schild auch von der anderen Seite (Hand und Schwert hinter dem Koerper), Beschriftung mit Waffe und Seite statt Kennung
          mkdir -p film/raster
          FF="FIGHTER_axt_rechts FIGHTER_axt_links FIGHTER_einhand_rechts FIGHTER_schild_links FIGHTER_schild_rechts ROGUE_bogen_links"
          wort() { case $1 in FIGHTER_axt_*) w="Kriegsaxt";; FIGHTER_einhand_*) w="Schwert";; FIGHTER_schild_*) w="Schwert und Schild";; *) w="Bogen";; esac
                   case $1 in *_rechts) echo "$w, von rechts";; *) echo "$w, von links";; esac; }
          n=0; for f in $FF; do c=$(ls film/$f | wc -l); [ $c -gt $n ] && n=$c; done
          for i in $(seq -f "%03g" 0 $((n - 1))); do
            set --; for f in $FF; do b=film/$f/$i.png; [ -f $b ] || b=$(ls film/$f/*.png | tail -1); set -- "$@" -label "$(wort $f)" $b; done
            montage "$@" -tile 3x2 -geometry 450x600+2+2 -background black -fill '#d4af37' -pointsize 24 film/raster/$i.png
          done
          ffmpeg -loglevel error -y -framerate 30 -i film/raster/%03d.png -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -c:v libx264 -pix_fmt yuv420p -crf 24 -preset veryfast -movflags +faststart $GITHUB_WORKSPACE/probe/417-pakete.mp4
          ls -l $GITHUB_WORKSPACE/probe
          ! grep -qE "SCRIPT ERROR|FILM FEHLER" $GITHUB_WORKSPACE/probe/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bornim-probe-417
          path: probe/
          if-no-files-found: ignore
