name: Godot (Umzug 348)

# 348.6: das Spiel in Godot (godot/): Karten aus core (MapExport), Modelle aus tools/blender348 (Blender als Modul),
# Android-Export; APK als Artefakt "bornim-godot-apk". Zum Testen neben dem alten Spiel: Kennung de.bornim.game.godot.
on:
  push:
    # 894 (Chef 10.11., 19:31: Build 275 eine Stunde verloren): auch jeder Testbuild claude/build-<n> baut von selbst
    branches: ["claude/tom-348-**", "claude/jerry-348-**", "claude/build-**"]   # 461.1: Grundstand nur von Hand (wie godot-kampf.yml)
    paths: ["godot/**", "tools/blender348/**", "tools/gegenstaende/**", "tools/sim444/**", "core/src/main/**", ".github/workflows/godot.yml"]
  workflow_dispatch:
    inputs:
      kampf:
        description: "Kampfort-Filme: ja (453 r3, 453.1 Vergleich), 461 (Grundstand-Film Kampfort), 4531 (Heldenatem Feld 2 gegen neu), 2963 (Siegerposen), 784 (Sollbild Wolfsrudel, eine Runde) oder 656 (Umhang: Film; mit film=nein Bilder vorher/nachher)"
        default: ""
      dorf:
        description: "Dorf-Film Grundstand (461.1): ja"
        default: ""
      schild:
        description: "Schildfilm 406 (Jerry, Schlussfilm): ja"
        default: ""
      bild:
        description: "Messlauf ohne Bilder und Filme (Perikles 02.11., 389/390a): nein"
        default: ""
      film:
        description: "Nur Bilder, kein Film (511: Probebild auf dem Bauserver, 390a): nein"
        default: ""
      strahlen:
        description: "Strahlenfilm 415 (Jerry, Beams-Probe im Kampfort): ja"
        default: ""
      gegner:
        description: "Gegnerfilm 494 (Jerry): Gegner der Probe, mit Komma (BOARS, …); FLEDERMAUS: Vergleich 510"
      kamin:
        description: "Kamine 501 (Spike): ja = Grundrisse am Tag und nachts (--raeume), Lage der Kaminflammen"
      drehteller:
        description: "Drehteller 499 (Spike): ja = Held je Klasse im Drehteller, Messung und Bilder"
        default: ""
      leute:
        description: "Gesichter der Leute 475 (Tom): ja"
        default: ""
      cache:
        description: "Kauf-Cache (854, 910): neu = Treffer übergehen, voll bauen, dann Gegenprobe gegen den abgelegten Stand"
        default: ""

# 894: mehrere Pushes auf einen Testbuild hintereinander, es baut nur der neueste (von Hand gestartete Läufe bleiben)
concurrency:
  group: godot-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Karten und Texte aus core
        run: |
          ./gradlew -p core test --tests '*MapExportTest*' --tests '*TextExportTest*' --tests '*HeroExportTest*' --tests '*MapSheetExportTest*' --tests '*IntroExportTest*' -q
          ./gradlew -p core exportMaps -Pout=$GITHUB_WORKSPACE/godot/daten/karten.json -q
          ./gradlew -p core exportTexts -Pout=$GITHUB_WORKSPACE/godot/daten/texte.json -q
          ./gradlew -p core exportHero -Pout=$GITHUB_WORKSPACE/godot/daten/held.json -q
          # 473: Monsterwerte und Regeln BRS (Modell D) aus derselben Datei wie die Simulation 444 (godot/regeln/brs.gd)
          cp tools/sim444/werte.json godot/daten/
          # 399.1 Intro wie alt (IntroExport): Saetze, Uhr, Klang, Fackelzug; die Bilder aus app/src/main/assets
          ./gradlew -p core exportIntro -Pout=$GITHUB_WORKSPACE/godot/daten/intro.json -q
          # als .bild wie hauptmenue.bild: Godot soll sie nicht importieren, zwischenbild.gd liest die Bytes
          mkdir -p godot/daten/intro && for f in app/src/main/assets/intro/*.jpg app/src/main/assets/intro/*.png app/src/main/assets/tempel/*.jpg; do b=$(basename $f); cp $f godot/daten/intro/${b%.*}.bild; done
          cp godot/bilder/logo-quer.svg godot/daten/logo.bild   # 292 Vorspann: Firmenzeichen scharf in jeder Groesse (hauptmenue.gd logo)
          # 399.1 Reiter Karte: Kartenblaetter aus core (MapSheetExport), Handschrift der Landkarte (Fondamento, OFL)
          ./gradlew -p core exportMapSheets -Pout=$GITHUB_WORKSPACE/godot/daten -q
          # 399.1 Bilder der Dinge (ThingArtExport): Vorraete und Ausruestung je Seltenheit wie im alten Spiel
          ./gradlew -p core exportThingArt -Pout=$GITHUB_WORKSPACE/godot/daten -q
          cp app/src/main/res/font/fondamento_regular.ttf godot/daten/fondamento.ttf
          cp app/src/main/assets/OFL-Fondamento.txt godot/daten/   # 497 (Homer 07.11.): die OFL verlangt Copyright und Lizenztext bei der Weitergabe
          # 458.2: Stufe und Preis aller Gegenstaende nur aus dem Gegenstandskatalog (godot/skripte/katalog.gd)
          cp tools/gegenstaende/gegenstaende.json godot/daten/
      # 348.12e gekaufte Modelle aus dem privaten Repo bornim-kaufmodelle (348.12c a), danach unter $KAUF;
      # nie hierher committen, nie als Artefakt; ohne Geheimnis KAUF_TOKEN baut alles ohne Kaufmodelle
      - name: Gekaufte Modelle (privat)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf
      # 854 (Chef 10.11., 12:34; 11.11., 08:52 Kennung je Block): gebaute Modelle aus dem Kaufrepo, je Block ein Zweig bau/<block>-<Kennung>
      # (figur, dorf, klassen, kampf; Kennung nur über die Dateien, die der Block liest, tools/godot/kauf_cache.py); ein Treffer überspringt
      # seinen Teil, die Dateien kommen vor „Kampfort bauen“ (die Kaufschilde ersetzen dort Waffen aus „Leute bauen“); was fehlt, wird
      # gebaut und abgelegt. Diese Zeilen nennen je Block treffer oder bauen und was sich geändert hat. Nicht bei kampf=656 (baut den
      # Helden vorher dazu). KAUF_TOKEN braucht dafür Schreibrecht (Contents) aufs Kaufrepo.
      - name: Gebaute Kaufmodelle pruefen (854)
        if: github.event.inputs.kampf != '656'
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          python3 -c "import yaml" 2> /dev/null || python3 -m pip install -q pyyaml   # vor setup-python: System-Python
          python3 tools/godot/kauf_cache.py pruefen --env $GITHUB_ENV || true
      # 804 (Chef 09.11., 21:12): Grass & Wind Kit v1.0.1 (REEBOO, gekauft, stufe1) fuers Gras im Dorf und Wald (skripte/grasbausatz.gd);
      # die Lizenz verbietet die Weitergabe der Dateien: nie ins Repo (godot/.gitignore), nie als Artefakt, nur in den Bau. Nur, was das
      # Spiel braucht (Netze, Vorlagen, Shader, Wind), ohne Editor-Plugin, Demo und Szenen; dazu das Autoload GrassWind und die globalen
      # Shaderwerte gw_* wie im project.godot des Kits. Fehlt das Kit, bleibt unser Gras (halm.gdshader).
      - name: Gras-Kit (804, privat)
        run: |
          s=$(find "$KAUF/anhang/stufe1" -maxdepth 4 -type d -path '*Grass_Wind_Kit*/addons/grass_wind_kit' 2>/dev/null | head -1)
          [ -n "$s" ] || { echo "Gras-Kit: nicht da, unser Gras"; exit 0; }
          d=godot/addons/grass_wind_kit; mkdir -p $d
          cp -r "$s/meshes" "$s/presets" "$s/shaders" $d/
          mkdir -p $d/wind && cp "$s/wind/grass_wind.gd" "$s/wind/wind_pusher_3d.gd" $d/wind/
          rm -f $d/presets/sway_2d_* $d/shaders/sway_2d.gdshader $d/meshes/terrain_* $d/presets/*alien* $d/presets/bush_* $d/presets/ground_*
          # MIT-Teil (David Hoskins, Hashfunktionen; LISTE-QUELLEN unten 2): Copyright-Zeile fuer „Lizenzen“ (hauptmenue.gd lizenz_texte)
          grep -rhoE 'Copyright[^"]*Hoskins[^"]*' "$s/.." "$s" --include='*.gdshader*' --include='*.txt' 2>/dev/null | sed 's/^[ /*#]*//' | sort -u | head -1 > godot/daten/gras_mit.txt || true
          python3 - << 'PY'
          p = 'godot/project.godot'
          s = open(p).read()
          if 'GrassWind=' not in s:
              s = s.replace('[autoload]\n', '[autoload]\n\nGrassWind="*res://addons/grass_wind_kit/wind/grass_wind.gd"\n', 1)
          if '[shader_globals]' not in s:
              s += '\n[shader_globals]\n\n' + ''.join('%s={\n"type": "vec4",\n"value": Vector4(0, 0, 0, 0)\n}\n' % n for n in ['gw_push_0', 'gw_push_1', 'gw_push_2', 'gw_push_3', 'gw_wind', 'gw_wind_time'])
          open(p, 'w').write(s)
          PY
          echo "Gras-Kit: $(ls $d/meshes | tr '\n' ' ')"; echo "Gras-Kit MIT: $(cat godot/daten/gras_mit.txt)"; grep -c "gw_\|GrassWind" godot/project.godot
      # 415 (Jerry, Chef „415 jetzt“ 02.11., 10:55; „415d muss ins nächste Build“ 22:05): Beams Free Sample (reeboolabs) aus
      # bornim-kaufmodelle anhang/beams; die Lizenz verbietet die Weitergabe der Dateien, darum nie ins Repo (godot/.gitignore), nur in den Bau
      # 806 (Chef 09.11., 21:12: Kampforte mit den Paketen schöner): aus R7 Stylized VFX v2.0 Lichtschacht mit Staub (dust_motes) und
      # aus R8 Weather FX nur der Bodennebel (mist-Shader, ohne Wettersteuerung: die griffe in Himmel und Licht ein); Lizenz wie 804:
      # nie ins Repo (godot/.gitignore), nur in den Bau; nur, was kampf/kampf_effekte.gd lädt. Fehlt ein Paket, bleibt der Kampfort wie bisher.
      - name: Effekt-Pakete (806, privat)
        run: |
          v=$(find "$KAUF/anhang/stufe1" -maxdepth 4 -type d -path '*Stylized_VFX_v2*/addons/reeboo_vfx' 2>/dev/null | head -1)
          if [ -n "$v" ]; then d=godot/addons/reeboo_vfx; mkdir -p $d/effects
            cp "$v/vfx_effect.gd" $d/ && cp -r "$v/shaders" "$v/textures" $d/ && cp "$v/effects/dust_motes.tscn" "$v/effects/footstep_dust.tscn" $d/effects/
            echo "R7: $(ls $d/effects | tr '\n' ' ')"; else echo "R7: nicht da"; fi
          w=$(find "$KAUF/anhang/stufe1" -maxdepth 4 -type d -path '*Weather_FX*/addons/weather_fx' 2>/dev/null | head -1)
          if [ -n "$w" ]; then d=godot/addons/weather_fx/shaders_3d; mkdir -p $d
            cp "$w/shaders_3d/mist.gdshader" "$w/shaders_3d/wfx_field.gdshaderinc" $d/; echo "R8: $(ls $d | tr '\n' ' ')"; else echo "R8: nicht da"; fi
      - name: Beams-Probe (415, privat)
        run: |
          d=$(find "$KAUF/anhang/beams" -type d -path '*addons/reeboo_beams' 2>/dev/null | head -1)
          if [ -n "$d" ]; then mkdir -p godot/addons && cp -r "$d" godot/addons/ && echo "Beams-Probe: $(ls godot/addons/reeboo_beams/beams_3d)"; else echo "Beams-Probe: nicht da"; fi
      # 814 (Spike; 623.8 A, Chef 09.11., 22:23): Effekte Szene 1 Dorf am Abend (skripte/dorfeffekte.gd) aus REEBOO Stylized VFX v2.0
      # (R7, enthaelt Pack 1) und Pack 3 (R4), beide unter addons/reeboo_vfx (gemeinsame Dateien gleich, 11.11. verglichen), dazu aus
      # den Surface Shaders (R11) nur die Fahne (cloth_flag) mit ihren Texturen. Lizenz verbietet die Weitergabe: nie ins Repo
      # (godot/.gitignore), nur in den Bau. Fehlt ein Paket, bleibt das Dorf wie bisher. Jerry (623.2) nimmt dieselben Pakete von hier.
      - name: Effektpakete (814, privat)
        run: |
          d=godot/addons/reeboo_vfx
          for p in REEBOO_Stylized_VFX_v2 Stylized_VFX_Pack_3; do
            s=$(find "$KAUF/anhang/stufe1" -maxdepth 4 -type d -path "*${p}*/addons/reeboo_vfx" 2>/dev/null | head -1)
            [ -n "$s" ] && { mkdir -p $d && cp -r "$s/." $d/ && rm -f $d/README.md $d/LICENSE.txt; } || echo "Effekte: $p nicht da"
          done
          s=$(find "$KAUF/anhang/stufe1" -maxdepth 4 -type d -path '*Stylized_Surface_Shaders*/addons/reeboo_surfaces' 2>/dev/null | head -1)
          if [ -n "$s" ]; then
            f=godot/addons/reeboo_surfaces; mkdir -p $f/shaders $f/textures
            cp "$s/shaders/cloth_flag.gdshader" "$s/shaders/surface_common.gdshaderinc" $f/shaders/
            cp "$s/textures/fabric_rgba.png" "$s/textures/fabric_normal.png" "$s/textures/noise_rgba.png" $f/textures/
          else echo "Effekte: Surface Shaders nicht da"; fi
          echo "Effekte: $(ls $d/effects $d/pack3_effects 2>/dev/null | grep -cE '\.tscn$') Szenen, Fahne $(ls godot/addons/reeboo_surfaces/shaders 2>/dev/null | tr '\n' ' ')"
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      # Lauf 124 (28.10.): der Runner hatte ein neues Python (3.13.17), die zwischengespeicherte Umgebung zeigte ins alte; Schluessel mit der Fassung
      - uses: actions/cache@v4
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}-py${{ steps.py.outputs.python-version }}
      - name: Blender als Python-Modul
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          [ -x bl/bin/python ] || { rm -rf bl; python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
      # 348.6 Held und Leute auf dem CC0-Geruest (348.12): Knochen und Bewegungen aus Quaternius' Universal Animation Library (CC0 1.0)
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-4
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
          # 376 (Chef 22:14, 22:16 „376 A2“): Gwennas Haus aus dem Dorfbausatz (dorf.py PROBEHAUS, Vorgabe 3,12)
          [ -d ~/cc0/medieval-village-megakit ] || PAKETE=medieval-village-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          # 348.6 (Chef 28.10., 00:07 „weitere Objekte platzieren“; 376: Felsen, Pilze ja): Naturbausatz fuer dorf.py dinge_mehr
          [ -d ~/cc0/stylized-nature-megakit ] || PAKETE=stylized-nature-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          # 399.5 (Chef 28.10., 21:5x): Einrichtung der Grundrisse aus dem freien Moebelbausatz (raum.py)
          [ -d ~/cc0/fantasy-props-megakit ] || PAKETE=fantasy-props-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Modelle bauen (Held, Dorf)
        if: env.KAUF_ALLES != 'treffer'
        run: |
          export OUT=$RUNNER_TEMP/out KARTEN=$GITHUB_WORKSPACE/godot/daten/karten.json
          D=godot/daten
          python3 tools/godot/kauf_cache.py merke start   # 854: Block figur (tex, held3, rig), auch wenn klassen oder kampf fehlen
          bl/bin/python -I tools/blender348/v3/tex.py > tex.log 2>&1 || { tail -40 tex.log; exit 1; }
          if [ "${KAUF_FIGUR_BAUEN:-ja}" = ja ]; then
            for s in held3 rig; do
              bl/bin/python -I tools/blender348/v3/$s.py > $s.log 2>&1 || { tail -40 $s.log; exit 1; }
            done
            grep -h "GLB OK\|ANIM\|DREIECKE\|ANTEIL\|NETZ" rig.log
            cp $OUT/held.glb $D/held.bin && cp $OUT/held-info.json $D/
            # 397: Ruhebewegungen aus der gekauften UAL Pro im Helden, dann ist er ein Kaufmodell (348.12i)
            grep -q '^RUHE aus' rig.log && echo daten/held.bin >> $D/kauf.txt || true
          fi
          python3 tools/godot/kauf_cache.py merke figur   # 854: Block dorf (dorf, raum, Bodenbilder)
          if [ "${KAUF_DORF:-bauen}" != treffer ]; then
          bl/bin/python -I tools/blender348/v3/dorf.py > dorf.log 2>&1 || { tail -40 dorf.log; exit 1; }
          grep -h "GLB OK\|NETZ" dorf.log
          cp $OUT/dorf.glb $D/dorf.bin && cp $OUT/dorf-info.json $D/
          # 399.1 Grundrisse (raum.py): Schenke, Laden, Aeltester, Tempel
          for g in inn shop elder temple; do KARTE=$g bl/bin/python -I tools/blender348/v3/raum.py > raum-$g.log 2>&1 || { tail -30 raum-$g.log; exit 1; }; cp $OUT/$g.glb $D/$g.bin && cp $OUT/$g-info.json $D/; done
          for t in gras erde pflaster halme korn weiss; do cp $OUT/tex/$t.png $D/$t.bild; done
          cp $OUT/boden-maske.png $D/boden-maske.bild
          # 490, 491 Gebietskarten des Walds (dorf.py KARTE=<karte>): <karte>.bin, -info.json, -boden-maske.bild (gebiet.gd datei, maske)
          for g in forest deep_forest; do KARTE=$g bl/bin/python -I tools/blender348/v3/dorf.py > dorf-$g.log 2>&1 || { tail -30 dorf-$g.log; exit 1; }
            grep -h "GLB OK\|NETZ" dorf-$g.log; cp $OUT/$g.glb $D/$g.bin && cp $OUT/$g-info.json $D/ && cp $OUT/$g-boden-maske.png $D/$g-boden-maske.bild; done
          fi
          python3 tools/godot/kauf_cache.py merke dorf
          ls -l $D
      # 376.1 (Chef 28.10., 22:0x): der Held je Klasse auf Kaufkoerper und Kaufkopf (held_klassen.py), Haare, Bewegungen aus der UAL;
      # seit 01.11. je Tracht der Herkunft und Geschlecht (held_<TRACHT>_<M|W>), mit Statur;
      # gekauft, also verschluesselt (kauf.txt). Ohne Kaufpakete (KAUF_TOKEN) bleibt der bisherige Held (held.bin)
      - name: Held je Klasse (376.1, gekauft)
        if: env.KAUF_KLASSEN != 'treffer'
        run: |
          python3 tools/godot/kauf_cache.py merke vor_klassen   # 854: Block klassen
          if [ -z "$(find ${KAUF:-/kein} -name 'Regular_Male_OnlyHead.gltf' 2>/dev/null | head -1)" ]; then echo "ohne Kauf kein Held je Klasse"; exit 0; fi
          # 417a (Pruefer Dorf-Film 23:0x: Schwert blieb auf dem Ruecken, „Waffengang ''“): die Waffenpakete (waffengang.py) fehlten im
          # Spielbau, nur tom-probe-417.yml baute sie; ohne Gehen_<gang> haengt bewaffne() die Waffe auf den Ruecken
          U=$(find $KAUF -path '*Unreal-Godot*' -name UAL1.glb | sort | head -1); [ -n "$U" ] || U=$(find ~/cc0 -name UAL1_Standard.glb | sort | head -1)
          KAUF=$KAUF ZIEL=$U OUT=$RUNNER_TEMP/gang BL=$GITHUB_WORKSPACE/bl/bin/python bl/bin/python -I tools/blender348/v3/waffengang.py > gang.log 2>&1 || { tail -30 gang.log; exit 1; }
          grep -E "^(GANG|FEHLT|WAFFENGANG)" gang.log | sed "s|$KAUF/||g" | cut -c1-200
          GANG=$RUNNER_TEMP/gang OUT=$RUNNER_TEMP/out ZIEL=$RUNNER_TEMP/klassen Q=~/cc0 bl/bin/python -I tools/blender348/v3/held_klassen.py > klassen.log 2>&1 || { tail -40 klassen.log; exit 1; }
          grep -E "^TRACHT|^STATUR|HELD TRACHTEN|FEHLT" klassen.log
          D=godot/daten
          for f in $RUNNER_TEMP/klassen/held_*.glb; do n=$(basename $f .glb); cp $f $D/$n.bin; echo daten/$n.bin >> $D/kauf.txt; done
          cp $RUNNER_TEMP/klassen/haare.glb $D/haare.bin && cp $RUNNER_TEMP/klassen/bewegungen.glb $D/bewegungen.bin && cp $RUNNER_TEMP/klassen/held-klassen.json $D/
          cp $RUNNER_TEMP/klassen/haare_w.glb $D/haare_w.bin   # 376.1 Heldin
          printf 'daten/haare.bin\ndaten/haare_w.bin\ndaten/bewegungen.bin\n' >> $D/kauf.txt
          # 475 (Chef 03.11., 07:45/07:47): die Leute des Dorfs auf dem Kaufkoerper in ihrer Kleidung (held_klassen.py LEUTE_KAUF), Gesicht
          # je Person waehlt Godot (heldfigur.gd person, leute.json kauf); scheitert eine Person, bleibt ihre alte Figur
          LEUTE_KAUF=alle OUT=$RUNNER_TEMP/out ZIEL=$RUNNER_TEMP/leutekauf Q=~/cc0 timeout 2400 bl/bin/python -I tools/blender348/v3/held_klassen.py > leutekauf.log 2>&1 || { echo "LEUTE KAUF abgebrochen"; tail -40 leutekauf.log; }
          grep -E "^LEUTE|^KOPFTEIL|^KOPFSITZ|^KOPFFREI|^WANGE|^FEHLT|^KAUFKLEID OK|^OHNE" leutekauf.log | cut -c1-300 || true
          if [ -f $RUNNER_TEMP/leutekauf/leute-kauf.json ]; then
            for f in $RUNNER_TEMP/leutekauf/held_L_*.glb; do [ -f "$f" ] || continue; n=$(basename $f .glb); cp $f $D/$n.bin; echo daten/$n.bin >> $D/kauf.txt; done
            cp $RUNNER_TEMP/leutekauf/leute-kauf.json $D/
          fi
          # 403 (Jerry): Kampfbewegungen fuer den Kaufkoerper (unsere aus held.glb umgerechnet, Kandidaten aus der UAL Pro), gekauft
          SRC=$RUNNER_TEMP/out/held.glb ZIEL=$RUNNER_TEMP/klassen bl/bin/python -I tools/blender348/v3/held_kampf.py > held_kampf.log 2>&1 || { tail -30 held_kampf.log; exit 1; }
          grep -E "^KAMPF|^SS (GRIFF|TEMPO)|^ohne Sword" held_kampf.log
          cp $RUNNER_TEMP/klassen/kampf-bewegungen.glb $D/kampf-bewegungen.bin && echo daten/kampf-bewegungen.bin >> $D/kauf.txt
          # 406 (Tuffy): Tempo, Griff und Kontaktzeiten der Bewegungen aus Sword & Shield (figur.gd kampf_info); nur Zahlen
          cp $RUNNER_TEMP/klassen/kampf-bewegungen.json $D/
          ls -l $D/held_*.bin $D/haare.bin $D/haare_w.bin $D/bewegungen.bin $D/kampf-bewegungen.bin
          # 656 (Chef 08.11., 14:52, Beule unter dem Schwertarm): der Kämpfer noch einmal wie vorher (UMHANG_ARM=1, Umhang mit den
          # Armgewichten) für den Vergleich vorher/nachher im Schritt „Umhang 656“; nur von Hand mit kampf=656
          if [ "${{ github.event.inputs.kampf }}" = "656" ]; then
            UMHANG_ARM=1 TRACHTEN=WACHE GESCHLECHT=M GANG=$RUNNER_TEMP/gang OUT=$RUNNER_TEMP/out ZIEL=$RUNNER_TEMP/klassen_alt Q=~/cc0 \
              bl/bin/python -I tools/blender348/v3/held_klassen.py > klassen_alt.log 2>&1 || tail -20 klassen_alt.log
            grep -E "^UMHANG|HELD TRACHTEN|FEHLT" klassen_alt.log || true
            ls -l $RUNNER_TEMP/klassen_alt/held_*.glb || true
          fi
          python3 tools/godot/kauf_cache.py merke klassen
      - name: Leute bauen (Dorf)
        run: |
          # 348.6 Leute: jede Person des Dorfs, die leute.json kennt, als Figur (held3 FIGUR=<id>, rig), 4 zugleich
          ids=$(python3 -c "import json; k=json.load(open('godot/daten/karten.json'))['karten']; l=json.load(open('tools/blender348/v3/leute.json')); print(' '.join(sorted({x for m in ('village', 'inn', 'shop', 'elder', 'temple', 'forest', 'deep_forest') for n in k[m]['leute'] for x in (n['id'], n.get('aussehen', '')) if x in l})))")   # 399.1: auch die Leute der Grundrisse; 635: auch nach Aussehen (lyra_temple ist „lyra“)
          echo "Leute: $ids"
          bau() { o=$RUNNER_TEMP/leute/$1; mkdir -p $o
            for s in held3 rig; do OUT=$o FIGUR=$1 bl/bin/python -I tools/blender348/v3/$s.py > $o/$s.log 2>&1 || { echo "$1 $s"; tail -30 $o/$s.log; return 1; }; done; }
          export -f bau
          echo $ids | tr ' ' '\n' | xargs -P 4 -I{} bash -c 'bau {}'
          D=godot/daten/leute; mkdir -p $D
          for i in $ids; do cp $RUNNER_TEMP/leute/$i/held.glb $D/$i.bin && cp $RUNNER_TEMP/leute/$i/held-info.json $D/$i-info.json; done
          cp tools/blender348/v3/leute.json $D/   # 134.3 Ruf: Mann, Frau, Kind (ruf.gd stimme)
          for i in $ids; do grep -q '^RUHE aus' $RUNNER_TEMP/leute/$i/rig.log && echo daten/leute/$i.bin >> godot/daten/kauf.txt || true; done   # 397
          for i in $ids; do grep -h '^WENDE aus\|^BEWEGUNG Drehen' $RUNNER_TEMP/leute/$i/rig.log | sed "s/^/$i: /" | cut -c1-400 || true; done   # 416.8 Wenden mit Schritten (geruest.py)
          ls -l $D
          # 348.6 Leute Runde 4b: was die Leute tragen (leute.json "traegt"), aus Jerrys waffen.py (Waffen = Bereich Jerry);
          # liegt das Skript noch nicht in diesem Zweig, von seinem Zweig claude/jerry-348-kampf; fehlt eine Waffe, traegt sie keiner
          W=tools/blender348/waffen.py
          [ -f $W ] || { git fetch -q --depth 1 origin claude/jerry-348-kampf && git show FETCH_HEAD:$W > $RUNNER_TEMP/waffen.py && W=$RUNNER_TEMP/waffen.py; } || true
          dinge=$(python3 -c "import json; l=json.load(open('tools/blender348/v3/leute.json')); print(' '.join(sorted({v['traegt'] for k, v in l.items() if k != '_liesmich' and v.get('traegt')})))")
          dinge="$dinge longsword shield shortsword quarterstaff round_shield"   # 376.1 Grundausruestung der vier Klassen (heldfigur.gd, auf dem Ruecken)
          # 522 (Chef 04.11., 11:55: „die alte Bewaffnung … war weg, aber die neue ist nicht sichtbar“): jede Waffe, die waffen.py bauen
          # kann, auch fuer den Helden; Streitkolben, Kriegshammer und die uebrigen haben noch kein Modell (458.3)
          dinge="$dinge dagger scimitar handaxe shortbow"
          mkdir -p godot/daten/waffen
          for w in $dinge; do
            OUT=$RUNNER_TEMP/waffen WAFFE=$w bl/bin/python -I $W > $RUNNER_TEMP/waffe-$w.log 2>&1 && cp $RUNNER_TEMP/waffen/$w.glb godot/daten/waffen/$w.bin || echo "keine Waffe $w"
          done
          ls -l godot/daten/waffen
          # 348.6 Tiere zum Anschauen (Chef 16:52): Jerrys Modelle godot/tiere/<name>.glb (+ <name>-info.json), Knopf „Tiere“
          if ls godot/tiere/*.glb > /dev/null 2>&1; then
            mkdir -p godot/daten/tiere
            for f in godot/tiere/*.glb; do n=$(basename $f .glb); cp $f godot/daten/tiere/$n.bin; [ -f godot/tiere/$n-info.json ] && cp godot/tiere/$n-info.json godot/daten/tiere/; done
            ls -l godot/daten/tiere
          fi
      # 348.6 Dorftiere (Chefrunde 28.10., 08:09: „lieber ein paar Tiere zuerst ‚Platzieren‘“): die gekauften Tiere aus 387, gebaut mit
      # Jerrys kauftier.py (Tiere = 387 Bereich Jerry; liegt das Skript noch nicht in diesem Zweig, von seinem Zweig wie waffen.py);
      # Huhn, Rind, Ziege, Kaninchen (Leute.dorftiere stellt sie auf); ohne Kauf (KAUF_TOKEN) keine Dorftiere
      - name: Dorftiere bauen (387, gekauft)
        run: |
          [ -n "$(find $KAUF -name '*_Rig.fbx' 2>/dev/null | head -1)" ] || { echo "ohne Kauf keine Dorftiere"; exit 0; }
          S=tools/blender348
          if [ ! -f $S/kauftier.py ]; then
            git fetch -q --depth 1 origin claude/jerry-348-kampf
            S=$RUNNER_TEMP/jerry; mkdir -p $S
            for f in kauftier kaufratte glbquat; do git show FETCH_HEAD:tools/blender348/$f.py > $S/$f.py; done
          fi
          export S
          bau() { OUT=$RUNNER_TEMP/dorftiere TIER=$1 timeout 900 bl/bin/python -I $S/kauftier.py > $RUNNER_TEMP/dorftier-$1.log 2>&1 || { echo "$1 fehlt"; tail -20 $RUNNER_TEMP/dorftier-$1.log; }
            grep -E "MASS|TEMPO|FEHLT|FERTIG" $RUNNER_TEMP/dorftier-$1.log | cut -c1-200; }
          export -f bau
          echo huhn rind ziege kaninchen | tr ' ' '\n' | xargs -P 4 -I{} bash -c 'bau {}'
          D=godot/daten/dorftiere; mkdir -p $D
          for f in $RUNNER_TEMP/dorftiere/kauf_*.glb; do [ -f "$f" ] && cp $f $D/$(basename $f .glb).bin; done
          cp $RUNNER_TEMP/dorftiere/kauf_*-info.json $D/ 2>/dev/null || true
          ls -l $D
          # 348.12i: gekauft, also nur verschluesselt ins APK
          (cd godot && ls daten/dorftiere/*.bin 2>/dev/null >> daten/kauf.txt) || true
      - name: Gebaute Kaufmodelle holen (854)
        if: env.KAUF_HOLEN == 'ja'
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          python3 -c "import yaml" 2> /dev/null || python3 -m pip install -q pyyaml   # 854: nach setup-python ohne yaml (Lauf 335)
          python3 tools/godot/kauf_cache.py holen
      - name: Kampfort bauen (Jerry 348.7, 399.1)
        if: env.KAUF_KAMPF != 'treffer'
        run: |
          python3 tools/godot/kauf_cache.py merke vor_kampf   # 854: Block kampf
          # 399.1 (Chef 28.10., 12:34): Kampf im selben Spiel wie das Dorf; Modelle wie godot-kampf.yml (Jerry), Held und Gras aus „Modelle bauen“
          export OUT=$RUNNER_TEMP/out
          bau() { n=$1; shift; l=$RUNNER_TEMP/k-$n-$(echo "$@" | tr -c "a-z_\n" -).log; env "$@" bl/bin/python -I tools/blender348/$n > $l 2>&1 || { tail -40 $l; exit 1; }; }
          bau wolf.py; bau wolf.py ART=dire_wolf; bau kampfort_wald.py; bau waffen.py; bau ratte.py
          # 494 (Jerry 03.11., 19:1x): die Riesenfledermaus fehlte im Spiel-Build (nur im Film 510 gebaut), Fledermäuse auf der Karte
          # standen als Platzhalter; die eigene (fledermaus.py), bis der Chef in 510 wählt
          bau fledermaus.py
          for o in waldrand teich baum felsen steinkreis; do bau kampfort_wald.py SPOT=$o; done   # 493 Kampforte im Wald wie alt
          for a in goblin goblin_archer goblin_shaman kobold; do bau goblin.py ART=$a V3=tools/blender348/v3_kampf; done   # v3_kampf/LIESMICH.md
          D=godot/kampf/daten; mkdir -p $D
          cp $OUT/held.glb $D/held.bin
          for f in grau dunkel rost asche; do cp $OUT/wolf-$f.glb $D/wolf-$f.bin; done; cp $OUT/wolf-info.json $D/
          for f in schwarz schimmer; do cp $OUT/dire_wolf-$f.glb $D/dire_wolf-$f.bin; done; cp $OUT/dire_wolf-info.json $D/
          for f in braun grau schwarz; do cp $OUT/giant_rat-$f.glb $D/giant_rat-$f.bin; done; cp $OUT/giant_rat-info.json $D/
          for f in braun schwarz grau; do cp $OUT/giant_bat-$f.glb $D/giant_bat-$f.bin; done; cp $OUT/giant_bat-info.json $D/
          cp $OUT/kampfort-wald.glb $D/kampfort-wald.bin; cp $OUT/wald-maske.png $D/wald-maske.bild
          for o in waldrand teich baum felsen steinkreis; do cp $OUT/kampfort-wald-$o.glb $D/kampfort-wald-$o.bin; cp $OUT/wald-maske-$o.png $D/wald-maske-$o.bild; done
          for w in dagger shortsword longsword quarterstaff shield round_shield scimitar handaxe scimitar-rost handaxe-rost dagger-rost dagger-kobold round_shield-grob shortbow staff-schamane spear-rost; do cp $OUT/$w.glb $D/$w.bin; done
          for k in leder kappe helm; do cp $OUT/goblin-$k.glb $D/goblin-$k.bin; done; cp $OUT/goblin-info.json $D/
          for k in kapuze kappe fell; do cp $OUT/goblin_archer-$k.glb $D/goblin_archer-$k.bin; done; cp $OUT/goblin_archer-info.json $D/
          for k in robe fell beides; do cp $OUT/goblin_shaman-$k.glb $D/goblin_shaman-$k.bin; done; cp $OUT/goblin_shaman-info.json $D/
          for k in kappe schild fell; do cp $OUT/kobold-$k.glb $D/kobold-$k.bin; done; cp $OUT/kobold-info.json $D/
          for t in gras erde halme; do cp $OUT/tex/$t.png $D/$t.bild; done
          : > $D/kauf.txt
          if [ -n "${KAUF:-}" ] && [ -d "$KAUF" ]; then
            KAUF=$KAUF OUT=$RUNNER_TEMP/kr timeout 1200 bl/bin/python -I tools/blender348/kaufratte.py > kaufratte.log 2>&1 || { tail -60 kaufratte.log; exit 1; }
            for f in braun grau schwarz; do cp $RUNNER_TEMP/kr/giant_rat-$f.glb $D/giant_rat-$f.bin; done; cp $RUNNER_TEMP/kr/giant_rat-info.json $D/
            KAUF=$KAUF OUT=$RUNNER_TEMP/kw timeout 1200 bl/bin/python -I tools/blender348/kaufwolf.py > kaufwolf.log 2>&1 || { tail -60 kaufwolf.log; exit 1; }
            for f in grau dunkel rost asche; do cp $RUNNER_TEMP/kw/kaufwolf-$f.glb $D/kaufwolf-$f.bin; done; cp $RUNNER_TEMP/kw/kaufwolf-info.json $D/
            # 494 (Chef 03.11., 16:08, Grimmzahn „nicht wie unsere Wölfe aus dem Kampf“): Grimmzahn auf dem Kaufwolf (kaufwolf.py
            # ART=dire_wolf) statt wolf.py; misslingt er, bleibt der eigene (Lauf 229: ein Fehler kostete den ganzen Bau)
            if ART=dire_wolf KAUF=$KAUF OUT=$RUNNER_TEMP/kg timeout 1200 bl/bin/python -I tools/blender348/kaufwolf.py > kaufgrimm.log 2>&1; then
              grep -E "^(GLUT|FEHLT|GLB|MASS neu)" kaufgrimm.log | cut -c1-200 || true
              for f in schwarz schimmer; do cp $RUNNER_TEMP/kg/dire_wolf-$f.glb $D/dire_wolf-$f.bin; done; cp $RUNNER_TEMP/kg/dire_wolf-info.json $D/
              GRIMM_KAUF=1
            else echo "FEHLER 494: Grimmzahn auf dem Kaufwolf nicht gebaut, der eigene bleibt"; tail -40 kaufgrimm.log; fi
            # 494 (Wochenziel 03.11. Reihe 3): Gegner von Kapitel 1 aus dem Bestand, gekauft: Wildschwein (Janpec, kauftier.py wie die Dorftiere)
            # und Riesen-Hundertfüßer (MadeCG)
            # Riesenegel (Game Ready Studios) und Säureschnecke (Protofactor), Kauf 348.12c
            for t in keiler hundertfuesser egel schnecke; do
              # Lauf 229: brach ein Tier ab, fehlte der ganze Bau (kein Film); jetzt fehlt nur dieses Tier, der Rest baut weiter
              TIER=$t KAUF=$KAUF OUT=$RUNNER_TEMP/kt timeout 900 bl/bin/python -I tools/blender348/kauftier.py > kauftier-$t.log 2>&1 || { echo "FEHLER 494: $t nicht gebaut"; tail -40 kauftier-$t.log; continue; }
              grep -E "AUSPACKEN|BEWEGUNG|MASS|TEMPO|FEHLT|FERTIG" kauftier-$t.log | cut -c1-200 || true
              for f in $RUNNER_TEMP/kt/kauf_$t-*.glb; do cp $f $D/$(basename $f .glb).bin; done; cp $RUNNER_TEMP/kt/kauf_$t-info.json $D/
            done
            (cd godot && ls kampf/daten/giant_rat-*.bin kampf/daten/kaufwolf-*.bin kampf/daten/kauf_keiler-*.bin kampf/daten/kauf_hundertfuesser-*.bin kampf/daten/kauf_egel-*.bin kampf/daten/kauf_schnecke-*.bin > kampf/daten/kauf.txt 2>/dev/null || true)
            [ -n "${GRIMM_KAUF:-}" ] && (cd godot && ls kampf/daten/dire_wolf-*.bin >> kampf/daten/kauf.txt) || true
            # 406 (Chef 31.10., 23:22): Kaufschilde 2 (Kleriker, „shield“) und 15 (Kaempfer, „round_shield“) statt der eigenen aus
            # waffen.py, im Kampf und unterwegs auf dem Ruecken (daten/waffen); gekauft, also verschluesselt
            KAUF=$KAUF OUT=$RUNNER_TEMP/ks timeout 600 bl/bin/python -I tools/blender348/kaufschild.py > kaufschild.log 2>&1 || { tail -40 kaufschild.log; exit 1; }
            grep '^SCHILD' kaufschild.log
            mkdir -p godot/daten/waffen
            for w in shield round_shield; do cp $RUNNER_TEMP/ks/$w.glb $D/$w.bin; echo kampf/daten/$w.bin >> $D/kauf.txt
              cp $RUNNER_TEMP/ks/$w.glb godot/daten/waffen/$w.bin; echo daten/waffen/$w.bin >> godot/daten/kauf.txt; done
          fi
          # 494 (von Tom, 492: Graks Halle in der Höhle startet den Kampf aus der Szene): Grak wie godot-kampf.yml (348.12, 399.2):
          # Quaternius-Teile aus ~/cc0, Großaxt aus waffen.py ($OUT), Tod aus der gekauften UAL Pro (Death02), dann verschlüsselt;
          # ohne Kauf Death01 (CC0)
          PRO=$(find ${KAUF:-/kein} -path '*Unreal-Godot/UAL1.glb' 2>/dev/null | head -1)
          OUT=$RUNNER_TEMP/grak CC0=$HOME/cc0 WAFFEN=$RUNNER_TEMP/out UAL=$PRO TOD_QUELLE=$([ -n "$PRO" ] && echo Death02 || echo Death01) \
            timeout 1500 bl/bin/python -I tools/blender348/grak_gestalt.py > grak.log 2>&1 || { tail -40 grak.log; exit 1; }
          grep -E "^(ZWEIHAND|BEWEGUNG|TOD|WEG|HIEB)" grak.log | cut -c1-200 || true
          cp $RUNNER_TEMP/grak/grak-gestalt.glb $D/hobgoblin_captain-hauptmann.bin
          python3 -c "import json,sys; s=json.load(open(sys.argv[1])).get('spiel',{}); d={'waffen':[],'groesse_cm':186,'geruest':'cc0'}; d.update(s); json.dump({'hauptmann':d},open(sys.argv[2],'w'))" \
            $RUNNER_TEMP/grak/grak-gestalt-info.json $D/hobgoblin_captain-info.json
          [ -n "$PRO" ] && echo kampf/daten/hobgoblin_captain-hauptmann.bin >> $D/kauf.txt || true
          # 494 Riesenspinne (LISTE-FIGUREN „Riesenspinne“, Kauf 348.12c): Protofactor „Darkness Spider“ mit unseren drei Häuten,
          # ausgedünnt auf 5.800 Dreiecke; nur mit Kaufpaketen, dann verschlüsselt (gekauft)
          if [ -n "$(find ${KAUF:-/kein} -name DARKNESS_SPIDER.FBX 2>/dev/null | head -1)" ]; then
            KAUF=$KAUF OUT=$RUNNER_TEMP/spinne timeout 1200 bl/bin/python -I tools/blender348/kaufspinne.py > spinne.log 2>&1 || { tail -40 spinne.log; exit 1; }
            grep -E "^(DREIECKE|MASS|WEG|TEMPO|HALTUNG je|BODEN tiefster)" spinne.log | cut -c1-200 || true
            for f in $RUNNER_TEMP/spinne/giant_spider-*.glb; do cp $f $D/$(basename $f .glb).bin; echo kampf/daten/$(basename $f .glb).bin >> $D/kauf.txt; done
            cp $RUNNER_TEMP/spinne/giant_spider-info.json $D/
          fi
          # 506 Skelett (LISTE-FIGUREN „Skelett“, Kauf 348.12c A): Protofactor „Skeleton Knight“, drei Kits wie MonsterKit.kt (Kurzschwert
          # und Helm, Kurzschwert und Schild, Speer aus Ankers CC0-Paket und Helm), Knochen vergilbt, Eisen rostig; nur mit Kaufpaketen,
          # dann verschlüsselt (gekauft); misslingt es, stehen Platzhalter (Lauf 229: ein Fehler kostete den ganzen Bau)
          if [ -n "$(find ${KAUF:-/kein} -name SK_SkeletonKnight.FBX 2>/dev/null | head -1)" ]; then
            if KAUF=$KAUF OUT=$RUNNER_TEMP/skelett timeout 1200 bl/bin/python -I tools/blender348/kaufskelett.py > skelett.log 2>&1; then
              grep -E "^(DREIECKE gesamt|MASS neu|WEG|HIEB|AUGEN|SPEER|FEHLT)" skelett.log | cut -c1-200 || true
              for f in $RUNNER_TEMP/skelett/skeleton-*.glb; do cp $f $D/$(basename $f .glb).bin; echo kampf/daten/$(basename $f .glb).bin >> $D/kauf.txt; done
              cp $RUNNER_TEMP/skelett/skeleton-info.json $D/
            else echo "FEHLER 506: Skelett nicht gebaut"; tail -40 skelett.log; fi
          fi
          # 506 Wiedergänger (LISTE-FIGUREN „Wiedergänger“, ersetzt den Zombie, Kauf 348.12c A): RenderHub „Evil Undead“, drei Kits als
          # Hüllen aus dem Körper (Lumpen, Leichenhemd, rostiges Kettenhemd), Bewegungen aufs Gerüst des Körpers übertragen; nur mit
          # Kaufpaketen, dann verschlüsselt; misslingt es, kommt er nicht auf die Karte (Streuner.da)
          if [ -n "$(find ${KAUF:-/kein} -name 'evil.undead.zip' 2>/dev/null | head -1)" ]; then
            if KAUF=$KAUF OUT=$RUNNER_TEMP/untoter timeout 1200 bl/bin/python -I tools/blender348/kaufuntoter.py > untoter.log 2>&1; then
              grep -E "^(DREIECKE gesamt|MASS|WEG|HIEB|KIT|NAEGEL|FEHLT)" untoter.log | cut -c1-200 || true
              for f in $RUNNER_TEMP/untoter/zombie-*.glb; do cp $f $D/$(basename $f .glb).bin; echo kampf/daten/$(basename $f .glb).bin >> $D/kauf.txt; done
              cp $RUNNER_TEMP/untoter/zombie-info.json $D/
            else echo "FEHLER 506: Wiedergänger nicht gebaut"; tail -40 untoter.log; fi
          fi
          # 506 Grabhund (LISTE-FIGUREN „Grabhund“, ersetzt den Ghul): Protofactor „Barghest“, drei Häute (fahl, grabgrau, graublau) mit
          # Mähne lang, kurz, zerrupft und Narben; Haarkarten mit Durchsicht (toon.gdshader schnitt)
          if [ -n "$(find ${KAUF:-/kein} -name BARGHEST_AllMeshes.FBX 2>/dev/null | head -1)" ]; then
            if KAUF=$KAUF OUT=$RUNNER_TEMP/grabhund timeout 1200 bl/bin/python -I tools/blender348/kaufgrabhund.py > grabhund.log 2>&1; then
              grep -E "^(DREIECKE gesamt|MASS|WEG|BISS|HAAR|BEMALUNG|KOPF|FEHLT)" grabhund.log | cut -c1-200 || true
              for f in $RUNNER_TEMP/grabhund/ghoul-*.glb; do cp $f $D/$(basename $f .glb).bin; echo kampf/daten/$(basename $f .glb).bin >> $D/kauf.txt; done
              cp $RUNNER_TEMP/grabhund/ghoul-info.json $D/
            else echo "FEHLER 506: Grabhund nicht gebaut"; tail -40 grabhund.log; fi
          fi
          # 494 Krogg-Figur (LISTE-FIGUREN „Krogg“): Superheld (CC0) mit dem Kopf des gekauften Janpec-Bären, Morgenstern aus dem Anker-
          # Paket (CC0, privat); nur mit Kaufpaketen, dann verschlüsselt; ohne bleibt der Platzhalterkörper (figur.gd)
          if [ -n "$PRO" ] && [ -n "$(find ${KAUF:-/kein} -name Bear_Rig.fbx 2>/dev/null | head -1)" ]; then
            OUT=$RUNNER_TEMP/krogg CC0=$HOME/cc0 KAUF=$KAUF UAL=$PRO TOD_QUELLE=Death02 \
              timeout 1500 bl/bin/python -I tools/blender348/krogg_gestalt.py > krogg.log 2>&1 || { tail -40 krogg.log; exit 1; }
            grep -E "^(KOPF|BEWEGUNG|TOD|WEG|HIEB|STEHEN)" krogg.log | cut -c1-200 || true
            cp $RUNNER_TEMP/krogg/krogg-gestalt.glb $D/bugbear-krogg.bin
            python3 -c "import json,sys; s=json.load(open(sys.argv[1])).get('spiel',{}); d={'waffen':[],'groesse_cm':212,'geruest':'cc0'}; d.update(s); json.dump({'krogg':d},open(sys.argv[2],'w'))" \
              $RUNNER_TEMP/krogg/krogg-gestalt-info.json $D/bugbear-info.json
            echo kampf/daten/bugbear-krogg.bin >> $D/kauf.txt
          fi
          grep -q '^RUHE aus' rig.log && echo kampf/daten/held.bin >> $D/kauf.txt || true   # 397: Held mit Pro-Ruhe
          ls -l $D | wc -l
          python3 tools/godot/kauf_cache.py merke kampf
      # 348.12i (Chef 26.10., 19:41, „348.12i B“): gekaufte Modelle nur verschluesselt ins APK, Schluessel je Lauf neu, steht nur im
      # Programm (schluessel.gd), nie im Protokoll. Wer ein Kaufmodell nach godot/daten legt, traegt den Pfad in godot/daten/kauf.txt ein.
      # Erste Kaufmodelle im Spiel: die Dorftiere (Geraetetest, sonst fehlen sie)
      - name: Gebaute Kaufmodelle ablegen (854)
        if: env.KAUF_ALLES == 'bauen'
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          python3 -c "import yaml" 2> /dev/null || python3 -m pip install -q pyyaml   # 854 (Lauf 335: No module named 'yaml', nie abgelegt)
          python3 tools/godot/kauf_cache.py ablegen || echo "Ablegen misslungen (Schreibrecht KAUF_TOKEN?), Bau geht weiter"
          # 910: nach vollem Bau trotz Treffer zeigen, welche abgelegte Datei vom frisch gebauten Stand abweicht
          if [ "${{ github.event.inputs.cache }}" = "neu" ]; then python3 tools/godot/kauf_cache.py vergleich || true; fi
      - name: Kaufmodelle verschluesseln (348.12i)
        run: |
          K=$(openssl rand -hex 32)
          echo "::add-mask::$K"
          sed -i "s/^const KAUF := \"\"/const KAUF := \"$K\"/" godot/skripte/schluessel.gd
          grep -q "$K" godot/skripte/schluessel.gd || { echo "Schluessel nicht gesetzt"; exit 1; }
          touch godot/daten/kauf.txt
          cd godot && cat daten/kauf.txt kampf/daten/kauf.txt 2>/dev/null | sort -u | xargs -r bash ../tools/blender348/verschluesseln.sh $K   # 399.1: auch Jerrys Kampfort
          ls $RUNNER_TEMP/klassen_alt/held_*.glb > /dev/null 2>&1 && bash ../tools/blender348/verschluesseln.sh $K $RUNNER_TEMP/klassen_alt/held_*.glb || true   # 656: Held vorher
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      # 399.3 (Jerry; 398, Chef 28.10., 11:38: Klang wiederverwenden): Musik und Effekte des alten Spiels unverändert nach
      # daten/klang, liste.json mit den Namen je Ordner für klang.gd
      - name: Klang (399.3)
        run: |
          D=godot/daten/klang; mkdir -p $D
          cp -r app/src/main/assets/music app/src/main/assets/sfx app/src/main/assets/raum $D/
          # was das alte Spiel synthetisiert (Hiebe, Bisse, Pfeile, Schwung), aus demselben Kotlin-Code als .wav, dazu kampfklang.json
          ./gradlew -p core exportKlang -Pout=$GITHUB_WORKSPACE/$D/sfx -q && mv $D/sfx/kampfklang.json $D/
          # Raumfassungen (Room.kt) je Ort: raum/cave, hall, room, tavern
          python3 -c "import json, os; d='$D'; n=lambda p: sorted(f[:-4] for f in os.listdir(p) if f.endswith(('.ogg', '.wav'))); j={o: n(os.path.join(d, o)) for o in ('music', 'sfx')}; j['raum']={r: n(os.path.join(d, 'raum', r)) for r in sorted(os.listdir(os.path.join(d, 'raum')))}; json.dump(j, open(os.path.join(d, 'liste.json'), 'w'))"
          python3 -c "import json; j=json.load(open('$D/liste.json')); print('Klang:', {k: len(v) for k, v in j.items()}, {r: len(v) for r, v in j['raum'].items()})"
      - name: Godot und Exportvorlagen
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL --retry 5 --retry-delay 10 --retry-all-errors -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          [ -d templates ] || { curl -sSL --retry 5 --retry-delay 10 --retry-all-errors -o t.tpz $base/Godot_v$GODOT-stable_export_templates.tpz && unzip -q t.tpz && rm t.tpz; }
          mkdir -p ~/.local/share/godot/export_templates/$GODOT.stable
          cp templates/android_debug.apk templates/android_release.apk templates/version.txt ~/.local/share/godot/export_templates/$GODOT.stable/
      # 918 (Chef 11.11., 09:53 „1 ja“): ein roter Test bricht den Schritt nicht mehr ab (vorher bash -e: jeder Lauf zeigte höchstens
      # einen Fehler, ohne APK). Jede Zeile, die unter -e abgebrochen hätte, schreibt die Falle ERR nach rot.txt (Stufe, Test, Zeile);
      # am Ende rot, wenn rot.txt etwas enthält. Stufe „start“ = Start- und Absturztests (Import, Spiel startet, alle Skripte laden):
      # rot dort heißt keine Testbitte; danach Stufe „test“. APK und Standbilder kommen auch bei rot (Name mit „rot“ bzw. „startrot“).
      - name: Skripte pruefen
        id: pruefen
        run: |
          set +e
          ROT=$GITHUB_WORKSPACE/rot.txt; : > $ROT; STUFE=start
          trap 'z=$(sed -n "${LINENO}p" "$0"); t=$(echo "$z" | grep -oE "tests/[a-z0-9_]+\.gd" | head -1); echo "$STUFE ${t:-Zeile $LINENO}: ${z:0:160}" >> $ROT; echo "::error::918 rot ($STUFE) ${t:-Zeile $LINENO}"' ERR
          cd godot
          ~/godot/godot --headless --import --path . 2>&1 | tail -5 || true
          timeout 120 ~/godot/godot --headless --path . --quit-after 300 2>&1 | tee check.log | tail -20
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" check.log
          set -o pipefail; timeout 120 ~/godot/godot --headless --path . -s res://tests/skripte_pruefen.gd 2>&1 | grep -E "SKRIPTE|FALSCH"   # 399.1 Test 130
          STUFE=test
          timeout 600 ~/godot/godot --headless --path . -s res://tests/drehteller_499.gd 2>&1 | grep -E "FEHLER|DREHTELLER499|KANDIDAT|^\[Haltung|^[A-Z]+:|^  |SCRIPT ERROR" | cut -c1-300 || true   # 499 Messung ohne Bild, vorn im Schritt (Lauf 282: brach vorher an auftraege_542 ab) (Schild-Spalt), noch nicht sperrend
