          if grep -qx daten/held.bin godot/daten/kauf.txt; then grep -qx kampf/daten/held.bin $D/kauf.txt || echo kampf/daten/held.bin >> $D/kauf.txt; fi
          echo "Held im Kampfort: $(stat -c %s $D/held.bin) Bytes, $(grep -cx kampf/daten/held.bin $D/kauf.txt) Zeile in kampf/daten/kauf.txt"
