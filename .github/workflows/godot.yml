name: Godot (Umzug 348)

# 348.6: das Spiel in Godot (godot/): Karten aus core (MapExport), Modelle aus tools/blender348 (Blender als Modul),
# Android-Export; APK als Artefakt "bornim-godot-apk". Zum Testen neben dem alten Spiel: Kennung de.bornim.game.godot.
on:
  push:
    branches: ["claude/tom-348-**", "claude/jerry-348-**"]
    paths: ["godot/**", "tools/blender348/**", "core/src/main/**", ".github/workflows/godot.yml"]
  workflow_dispatch:

jobs:
  apk:
    # 385.1: auf dem Filmzweig nur der Film (Job zauber385), kein APK
    if: github.ref_name != 'claude/tom-348-385-film'
    runs-on: ubuntu-24.04
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Karten aus core
        run: |
          ./gradlew -p core test --tests '*MapExportTest*' -q
          ./gradlew -p core exportMaps -Pout=$GITHUB_WORKSPACE/godot/daten/karten.json -q
      # 348.12e gekaufte Modelle aus dem privaten Repo bornim-kaufmodelle (348.12c a), danach unter $KAUF;
      # nie hierher committen, nie als Artefakt; ohne Geheimnis KAUF_TOKEN baut alles ohne Kaufmodelle
      - name: Gekaufte Modelle (privat)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}
      - name: Blender als Python-Modul
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          [ -x bl/bin/python ] || { python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
      # 348.6 Held und Leute auf dem CC0-Geruest (348.12): Knochen und Bewegungen aus Quaternius' Universal Animation Library (CC0 1.0)
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-1
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Modelle bauen (Held, Dorf)
        run: |
          export OUT=$RUNNER_TEMP/out KARTEN=$GITHUB_WORKSPACE/godot/daten/karten.json
          for s in tex held3 rig dorf; do
            bl/bin/python -I tools/blender348/v3/$s.py > $s.log 2>&1 || { tail -40 $s.log; exit 1; }
          done
          grep -h "GLB OK\|ANIM\|DREIECKE\|ANTEIL\|NETZ" rig.log dorf.log
          D=godot/daten
          cp $OUT/held.glb $D/held.bin && cp $OUT/held-info.json $D/
          cp $OUT/dorf.glb $D/dorf.bin && cp $OUT/dorf-info.json $D/
          for t in gras erde pflaster halme korn weiss; do cp $OUT/tex/$t.png $D/$t.bild; done
          cp $OUT/boden-maske.png $D/boden-maske.bild
          ls -l $D
      - name: Leute bauen (Dorf)
        run: |
          # 348.6 Leute: jede Person des Dorfs, die leute.json kennt, als Figur (held3 FIGUR=<id>, rig), 4 zugleich
          ids=$(python3 -c "import json; k=json.load(open('godot/daten/karten.json'))['karten']; l=json.load(open('tools/blender348/v3/leute.json')); print(' '.join(sorted({n['id'] for n in k['village']['leute'] if n['id'] in l})))")
          echo "Leute: $ids"
          bau() { o=$RUNNER_TEMP/leute/$1; mkdir -p $o
            for s in held3 rig; do OUT=$o FIGUR=$1 bl/bin/python -I tools/blender348/v3/$s.py > $o/$s.log 2>&1 || { echo "$1 $s"; tail -30 $o/$s.log; return 1; }; done; }
          export -f bau
          echo $ids | tr ' ' '\n' | xargs -P 4 -I{} bash -c 'bau {}'
          D=godot/daten/leute; mkdir -p $D
          for i in $ids; do cp $RUNNER_TEMP/leute/$i/held.glb $D/$i.bin && cp $RUNNER_TEMP/leute/$i/held-info.json $D/$i-info.json; done
          ls -l $D
          # 348.6 Leute Runde 4b: was die Leute tragen (leute.json "traegt"), aus Jerrys waffen.py (Waffen = Bereich Jerry);
          # liegt das Skript noch nicht in diesem Zweig, von seinem Zweig claude/jerry-348-kampf; fehlt eine Waffe, traegt sie keiner
          W=tools/blender348/waffen.py
          [ -f $W ] || { git fetch -q --depth 1 origin claude/jerry-348-kampf && git show FETCH_HEAD:$W > $RUNNER_TEMP/waffen.py && W=$RUNNER_TEMP/waffen.py; } || true
          dinge=$(python3 -c "import json; l=json.load(open('tools/blender348/v3/leute.json')); print(' '.join(sorted({v['traegt'] for k, v in l.items() if k != '_liesmich' and v.get('traegt')})))")
          mkdir -p godot/daten/waffen
          for w in $dinge; do
            OUT=$RUNNER_TEMP/waffen WAFFE=$w bl/bin/python -I $W > $RUNNER_TEMP/waffe-$w.log 2>&1 && cp $RUNNER_TEMP/waffen/$w.glb godot/daten/waffen/$w.bin || echo "keine Waffe $w"
          done
          ls -l godot/daten/waffen
          # 348.6 Tiere zum Anschauen (Chef 16:52): Jerrys Modelle godot/tiere/<name>.glb (+ <name>-info.json), Knopf „Tiere“
          if ls godot/tiere/*.glb > /dev/null 2>&1; then
            mkdir -p godot/daten/tiere
            for f in godot/tiere/*.glb; do n=$(basename $f .glb); cp $f godot/daten/tiere/$n.bin; [ -f godot/tiere/$n-info.json ] && cp godot/tiere/$n-info.json godot/daten/tiere/; done
            ls -l godot/daten/tiere
          fi
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot und Exportvorlagen
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          [ -d templates ] || { curl -sSL -o t.tpz $base/Godot_v$GODOT-stable_export_templates.tpz && unzip -q t.tpz && rm t.tpz; }
          mkdir -p ~/.local/share/godot/export_templates/$GODOT.stable
          cp templates/android_debug.apk templates/android_release.apk templates/version.txt ~/.local/share/godot/export_templates/$GODOT.stable/
      - name: Skripte pruefen
        run: |
          cd godot
          ~/godot/godot --headless --import --path . 2>&1 | tail -5 || true
          timeout 120 ~/godot/godot --headless --path . --quit-after 300 2>&1 | tee check.log | tail -20
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" check.log
      # fester Schluessel ueber alle Laeufe, sonst lehnt Android das Update ab (348.5, Build 9)
      - uses: actions/cache@v4
        with:
          path: ~/bornim-godot-schluessel
          key: bornim-godot-schluessel-1
      - name: Android-Export
        run: |
          K=~/bornim-godot-schluessel/debug.keystore
          mkdir -p $(dirname $K)
          [ -f $K ] || keytool -genkeypair -v -keystore $K -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -validity 9999 -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          sed -i "s/^version\/code=.*/version\/code=$GITHUB_RUN_NUMBER/; s/^version\/name=.*/version\/name=\"0.348.$GITHUB_RUN_NUMBER\"/" godot/export_presets.cfg
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$K GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/editor_settings-${GODOT%.*}.tres
          cd godot
          ~/godot/godot --headless --path . --export-debug "Android" $GITHUB_WORKSPACE/bornim-godot.apk 2>&1 | tail -30
          ls -l $GITHUB_WORKSPACE/bornim-godot.apk
          unzip -l $GITHUB_WORKSPACE/bornim-godot.apk | grep -E "\.pck|daten" || { echo "Daten fehlen im APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bornim-godot-apk
          path: bornim-godot.apk
      # Standbilder mit dem Mobile-Renderer (Vulkan in Software, lavapipe) zum Pruefen und fuer das Vergleichsbild
      - name: Standbilder
        continue-on-error: true
        run: |
          sudo apt-get install -y -q mesa-vulkan-drivers xvfb > /dev/null
          mkdir -p $GITHUB_WORKSPACE/bilder
          cd godot
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json timeout 600 xvfb-run -a -s "-screen 0 1080x2340x24" \
            ~/godot/godot --path . --rendering-driver vulkan --rendering-method mobile --resolution 540x1170 -- --bilder=$GITHUB_WORKSPACE/bilder 2>&1 | grep -E "Vulkan|SCRIPT ERROR" || true
          ls -l $GITHUB_WORKSPACE/bilder
      - uses: actions/upload-artifact@v4
        with:
          name: bornim-godot-bilder
          path: bilder/
          if-no-files-found: ignore

  # 385.1 (Chef 28.10., 16:16: Film zu klein, fehlt in bilder): Zauberer-Set je Bewegung als eigener grosser Film (zauber_lauf.sh);
  # Kaufteile wie im APK-Job ueber KAUF_TOKEN (add_repo in der Sitzung gesperrt), nie als Artefakt; die Filme (gerendert, ohne
  # Rohdateien) gehen auf einen eigenen Zweig claude/tom-385-film-aus-<lauf>, von dort legt meldung.sh sie in „bilder“ ab
  zauber385:
    if: github.ref_name == 'claude/tom-348-385-film'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Gekaufte Modelle (privat)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}
      - name: Blender als Python-Modul, Vulkan in Software
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 mesa-vulkan-drivers xvfb ffmpeg > /dev/null
          [ -x bl/bin/python ] || { python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
          python3 -m pip -q install pillow
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-1
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          [ -f godot ] || { curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/$GODOT-stable/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
      - name: Zauberer-Film je Bewegung
        run: |
          [ -n "$(ls $KAUF/anhang 2>/dev/null)" ] || { echo "keine Kaufteile (KAUF_TOKEN)"; exit 1; }
          REPO=$GITHUB_WORKSPACE BL=$GITHUB_WORKSPACE/bl/bin/python bash tools/pruef348/zauber_lauf.sh $RUNNER_TEMP/q
          cat $RUNNER_TEMP/q/bild_zauber2/probe.txt || true
          ls -l $RUNNER_TEMP/q/aus $RUNNER_TEMP/q/aus/einzeln
      - name: Filme auf eigenen Zweig
        run: |
          cd $RUNNER_TEMP/q/aus && mkdir -p ab && cp einzeln/*.mp4 ab/ && cp 385-zauberer-grund_mitte.png ab/ 2>/dev/null || true
          cd ab && git init -q && git checkout -q -b f && git add . \
            && git -c user.name=tramour -c user.email=tramour@gmail.com commit -qm "385.1 Filme je Bewegung (Lauf $GITHUB_RUN_NUMBER)" \
            && git push -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} f:refs/heads/claude/tom-385-film-aus-$GITHUB_RUN_NUMBER
