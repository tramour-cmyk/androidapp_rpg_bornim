          film held-ss film_403 ATEM_ALT=1 OHNE_SIGNATUR=1
          film held-signatur film_403 ATEM_ALT=1 OHNE_SS=1
          V="held-wie403 held-heute held-atem held-ss held-signatur"
          L=$(for v in $V; do dauer $B/$v.mp4; done | sort -n | tail -1)
          i=0; FC=""; IN=""
          for v in $V; do
            case $v in held-wie403) t="1 wie Film 403";; held-heute) t="2 heute";; held-atem) t="3 nur Atem neu";; held-ss) t="4 nur SS neu";; *) t="5 nur Signatur neu";; esac
