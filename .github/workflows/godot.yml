          # eine Abweichung macht den Schritt rot (dann deckt die Kennung eine Eingabe nicht)
          # 1127 (Diogenes D196.2): die Gegenprobe hat ihr eigenes Rot; „Ablegen misslungen“ nur, wenn das Ablegen selbst scheiterte
          probe=0
          if [ -n "${KAUF_GEGENPROBE:-}" ]; then
