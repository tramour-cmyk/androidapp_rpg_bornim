      # 1101 (Sokrates 13.11., 09:43; Chef 09:41 „warum dauern die Läufe wieder so lange“): misslingt das Ablegen eines Blocks, wird der
      # Schritt rot (der Bau geht weiter, continue-on-error) und die Übersicht des Laufs sagt es; Lauf 420 blieb grün und der nächste
      # baute wieder alles neu
      - name: Gebaute Kaufmodelle ablegen (854)
        if: env.KAUF_ALLES == 'bauen'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          python3 -c "import yaml" 2> /dev/null || python3 -m pip install -q pyyaml   # 854 (Lauf 335: No module named 'yaml', nie abgelegt)
