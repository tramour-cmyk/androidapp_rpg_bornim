name: Herzschlag

# 1764 (Lücke L-T1, ablauf.md A18): lief tools/lauf.py (Ford) in den letzten 2 Stunden? Zeitmarke „**Stand:** … (lauf.py)“ in
# docs/ARBEIT-BESETZUNG.md, erneuert spätestens alle 60 Minuten. Kostet keine Token. Alarm einmal je Ausfall (Cache-Schlüssel je
# Zeitmarke): roter Lauf (GitHub meldet ihn dem Besitzer) und Telegram, wenn das Secret TELEGRAM_BOT_TOKEN gesetzt ist.
# Zeitpläne laufen bei GitHub ohne Gewähr (1191), darum prüft auch jeder Push auf docs/ in main.
on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: herzschlag
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/ARBEIT-BESETZUNG.md
            tools/herzschlag.py
          sparse-checkout-cone-mode: false
      - name: Zeitmarke prüfen
        id: hs
        run: |
          set +e
          zeile=$(python3 tools/herzschlag.py)
          rc=$?
          set -e
          echo "$zeile"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "marke=$(python3 tools/herzschlag.py --marke)" >> "$GITHUB_OUTPUT"
          { echo "zeile<<ENDE"; echo "$zeile"; echo "ENDE"; } >> "$GITHUB_OUTPUT"
          [ $rc = 1 ] && echo "::warning::$zeile"
          exit 0
      - name: Schon gemeldet?
        if: steps.hs.outputs.rc == '2'
        id: schon
        uses: actions/cache/restore@v4
        with:
          path: .herzschlag
          key: herzschlag-alarm-${{ steps.hs.outputs.marke }}
          lookup-only: true
      - name: Alarm
        if: steps.hs.outputs.rc == '2' && steps.schon.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ZEILE: ${{ steps.hs.outputs.zeile }}
        run: |
          mkdir -p .herzschlag && echo "$ZEILE" > .herzschlag/alarm
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=8965432899" --data-urlencode "disable_notification=false" \
              --data-urlencode "text=Herzschlag (GitHub): $ZEILE" > /dev/null
          else
            echo "::warning::Secret TELEGRAM_BOT_TOKEN fehlt, Alarm nur als roter Lauf"
          fi
      - name: Gemeldet merken
        if: steps.hs.outputs.rc == '2' && steps.schon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .herzschlag
          key: herzschlag-alarm-${{ steps.hs.outputs.marke }}
      - name: Roter Lauf beim ersten Alarm
        if: steps.hs.outputs.rc == '2' && steps.schon.outputs.cache-hit != 'true'
        run: |
          echo "::error::$ZEILE"
          exit 1
        env:
          ZEILE: ${{ steps.hs.outputs.zeile }}
