name: Spike Probe Tracht (376.1)

# 376.1 Tracht je Herkunft (Chef 01.11., 11:19 „376.1 wie Sokrates“, Archiv: Mann und Frau gleich; Kettenhemd und lange Robe an den
# Frauenkoerper angepasst, eine Runde mit Film, Durchdringung gemessen; langes Haar unter der Kapuze verborgen), dazu Statur wie alt.
# Modelle wie godot.yml (held_klassen.py), im Spiel gefilmt (figurenprobe --teil=trachten, trachtprobe.gd, tracht_film.py), Durchdringung
# der angepassten Trachten in Bewegung (pruef_tracht.py), Test held_klassen_376.gd. Kaufmodelle nur ueber diesen Ablauf, nie in eine
# Sitzung (416.4a); ins Artefakt nur Film, Protokolle, Zahlen (348.12c a). Nur bei Commits, die mit „376.1 Probe“ beginnen, oder von Hand.
on:
  push:
    branches: ["claude/spike-376-1-**"]
  workflow_dispatch:
    inputs:
      bild:
        description: "Film (ja) oder nur Messung ohne Bild (nein, 390a)"
        default: "ja"

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '376.1 Probe')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Karten und Texte aus core (wie godot.yml)
        run: |
          ./gradlew -p core exportMaps -Pout=$GITHUB_WORKSPACE/godot/daten/karten.json -q
          ./gradlew -p core exportTexts -Pout=$GITHUB_WORKSPACE/godot/daten/texte.json -q
          ./gradlew -p core exportHero -Pout=$GITHUB_WORKSPACE/godot/daten/held.json -q
          ./gradlew -p core exportIntro -Pout=$GITHUB_WORKSPACE/godot/daten/intro.json -q
          mkdir -p godot/daten/intro && for f in app/src/main/assets/intro/*.jpg app/src/main/assets/intro/*.png app/src/main/assets/tempel/*.jpg; do b=$(basename $f); cp $f godot/daten/intro/${b%.*}.bild; done
          cp godot/bilder/logo-quer.svg godot/daten/logo.bild
          ./gradlew -p core exportMapSheets -Pout=$GITHUB_WORKSPACE/godot/daten -q
          ./gradlew -p core exportThingArt -Pout=$GITHUB_WORKSPACE/godot/daten -q
          cp app/src/main/res/font/fondamento_regular.ttf godot/daten/fondamento.ttf
          cp app/src/main/assets/menu/hauptmenue.jpg godot/daten/hauptmenue.bild
      - name: Gekaufte Modelle (privat)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          timeout 1200 bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf > kauf.log 2>&1 || { tail -20 kauf.log; exit 1; }
          wc -l kauf.log
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}-py${{ steps.py.outputs.python-version }}
      - name: Blender als Python-Modul
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          [ -x bl/bin/python ] || { rm -rf bl; python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-4
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/medieval-village-megakit ] || PAKETE=medieval-village-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/stylized-nature-megakit ] || PAKETE=stylized-nature-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/fantasy-props-megakit ] || PAKETE=fantasy-props-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Modelle bauen (Held, Dorf; wie godot.yml)
        run: |
          export OUT=$RUNNER_TEMP/out KARTEN=$GITHUB_WORKSPACE/godot/daten/karten.json
          for s in tex held3 rig dorf; do
            bl/bin/python -I tools/blender348/v3/$s.py > $s.log 2>&1 || { tail -40 $s.log; exit 1; }
          done
          D=godot/daten
          cp $OUT/held.glb $D/held.bin && cp $OUT/held-info.json $D/
          cp $OUT/dorf.glb $D/dorf.bin && cp $OUT/dorf-info.json $D/
          for t in gras erde pflaster halme korn weiss; do cp $OUT/tex/$t.png $D/$t.bild; done
          cp $OUT/boden-maske.png $D/boden-maske.bild
      - name: Held je Tracht und Geschlecht (376.1, gekauft), Durchdringung
        run: |
          export OUT=$RUNNER_TEMP/out
          Z=$RUNNER_TEMP/klassen; mkdir -p $GITHUB_WORKSPACE/probe
          ZIEL=$Z Q=~/cc0 bl/bin/python -I tools/blender348/v3/held_klassen.py > $GITHUB_WORKSPACE/probe/klassen.log 2>&1 || { tail -40 $GITHUB_WORKSPACE/probe/klassen.log; exit 1; }
          grep -E "^TRACHT|^STATUR|HELD TRACHTEN|FEHLT|KLEIDUNG HINAUS|UMHANG UEBER|UNTER WEG" $GITHUB_WORKSPACE/probe/klassen.log
          D=godot/daten
          for f in $Z/held_*.glb; do cp $f $D/$(basename $f .glb).bin; done
          cp $Z/haare.glb $D/haare.bin && cp $Z/haare_w.glb $D/haare_w.bin && cp $Z/bewegungen.glb $D/bewegungen.bin && cp $Z/held-klassen.json $D/
          cp $Z/held-klassen.json $GITHUB_WORKSPACE/probe/
          ls -l $Z/*.glb | awk '{print $5, $9}'
          # Durchdringung unserer Trachten in Bewegung (pruef_tracht.py), Mann gegen Frau
          UAL=$(find ~/cc0 -name UAL1_Standard.glb | grep -i godot | head -1); [ -n "$UAL" ] || UAL=$(find ~/cc0 -name UAL1_Standard.glb | head -1)
          for k in WACHE_M:$Z/roh_held_m WACHE_W:$Z/roh_held_w ROBE_M:$Z/roh_held_wizard_m ROBE_W:$Z/roh_held_wizard_w; do
            n=${k%%:*}; h=${k#*:}
            FIG=$Z/roh/held_$n.blend UAL=$UAL HELDOUT=$h/x timeout 900 bl/bin/python -I tools/blender348/v3/pruef_tracht.py > probe/durch-$n.log 2>&1 || echo "pruef_tracht $n $?"
            echo "== $n"; grep -E "^(DURCH|BEDECKT|FEHLT|ORT)" probe/durch-$n.log | cut -c1-700
          done
          # 463 (Tom 02.11., 22:0x): Unterlagen weg im Bau (kauf_kleid UNTER_WEG); WEG1, 2 = Robe am Guertel und Aermel weiter (pruef_flecken.py „|“); RUECK = Rueckseiten im Zeichnen zurueck (pruef_flecken.py), „r+n“ dazu Aermel n zurueck
          # 376.1 Urteil Tracht (Chef 01.11., 20:2x): was die Kamera sieht, Flecken in Umhang und Robe (pruef_flecken.py), ringsum und von hinten
          for k in WACHE_M:roh_held_m:cloak WACHE_W:roh_held_w:cloak ROBE_M:roh_held_wizard_m:robe,chain ROBE_W:roh_held_wizard_w:robe,chain; do
            IFS=: read n r h <<< "$k"
            GLB=$Z/held_$n.glb ROH=$Z/roh/held_$n.blend TEILE=$Z/$r/teile.json UAL=$UAL HUELLE=$h AUF=0.01 BILDER=4 RUECK=0.04 WEG="robe:belt+buckle:0.06:beide|robe:belt+buckle:0.06:beide&sleeves:robe:0.06:beide" timeout 2400 bl/bin/python -I tools/blender348/v3/pruef_flecken.py > probe/flecken-$n.log 2>&1 || echo "pruef_flecken $n $?"
            echo "== $n"; grep -E "^(FLECKEN|FEHLT|VORRANG|RUECK|WEG|LOCH)" probe/flecken-$n.log | grep -v " WO " | cut -c1-500
          done
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          ~/godot/godot --version
      - name: Test und Film
        if: inputs.bild != 'nein'
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          command -v ffmpeg > /dev/null || { python3 -m pip install -q imageio-ffmpeg && mkdir -p ~/ffbin && ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/ffbin/ffmpeg; }
          export PATH=~/ffbin:$PATH
          A=$RUNNER_TEMP/aus; mkdir -p $A
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          timeout 600 ~/godot/godot --headless --path . -s res://tests/held_klassen_376.gd > $GITHUB_WORKSPACE/probe/test.log 2>&1 || true
          grep -E "HELDKLASSEN|FALSCH|SCRIPT ERROR|^HERKUNFT" $GITHUB_WORKSPACE/probe/test.log | cut -c1-300 | head -60
          timeout 2400 xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --rendering-driver opengl3 --path . --resolution 1080x720 \
            -- --figuren=$A --teil=trachten > $GITHUB_WORKSPACE/probe/probe.log 2>&1 || true
          grep -E "^(TRACHT|TEIL|FEHLT|KAMERA|SIGNATUR|AUSSCHNITT|ATEM)|SCRIPT ERROR|^ +at: " $GITHUB_WORKSPACE/probe/probe.log | cut -c1-300 | head -60
          cp $A/probe.txt $A/trachten/lage.json $GITHUB_WORKSPACE/probe/ 2>/dev/null || true
          # 463a (Pruefer Lauf 1: kein Boden, kein Schatten, Grund einfarbig 118/135/112): Rohbilder aus Godot zum Nachstellen
          for t in umhang_1 robe_2; do cp $A/trachten/$t/0000.png probe/roh-$t-0000.png 2>/dev/null || true; done
          cd $GITHUB_WORKSPACE
          bl/bin/python -I tools/blender348/v3/tracht_film.py $A/trachten godot/kampf/schrift/alegreya_regular.ttf $RUNNER_TEMP/seiten
          ffmpeg -loglevel error -y -framerate 30 -i $RUNNER_TEMP/seiten/%04d.png -c:v libx264 -pix_fmt yuv420p -crf 24 -preset veryfast -movflags +faststart probe/3761-tracht.mp4
          for i in 0000 0180 0360 0600 0780; do cp $RUNNER_TEMP/seiten/$i.png probe/3761-$i.png 2>/dev/null || true; done
          ls -l probe
          # ohne waffen.py (Jerry) haengt keine Waffe auf dem Ruecken: diese Befunde zaehlen hier nicht
          ! grep "^FALSCH" probe/test.log | grep -qv "auf dem Ruecken" && ! grep -q "SCRIPT ERROR" probe/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bornim-probe-3761
          path: probe/
          if-no-files-found: ignore
