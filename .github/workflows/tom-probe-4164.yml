name: Tom Probe Rennen (416.4)

# 416.4 (Chef 01.11., 11:28 „neuer Film“ mit heute, A, B): der Kaempfer auf dem Kaufkoerper, wie er im Spiel laeuft (heldfigur.gd
# RENNEN_ARTEN), drei Felder untereinander (tests/rennen_film_4164.gd), dazu die Messung ohne Bild (tests/rennen_kauf_4164.gd).
# Kaufmodelle nur ueber einen Ablauf auf GitHub (Chefsache 416.4a); ins Artefakt gehen nur Film und Protokolle (348.12c a).
# Nur bei Commits, die mit „416.4“ beginnen, oder von Hand.
on:
  push:
    branches: ["claude/tom-416-4-**"]
    paths: ["godot/skripte/heldfigur.gd", "godot/tests/rennen_*", ".github/workflows/tom-probe-4164.yml"]
  workflow_dispatch:
    inputs:
      film:
        description: "Film drehen (ja/nein; nein: nur Messung ohne Bild, kein Probelauf)"
        default: "ja"

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '416.4')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Karten und Texte aus core (wie godot.yml)
        run: |
          ./gradlew -p core exportMaps -Pout=$GITHUB_WORKSPACE/godot/daten/karten.json -q
          ./gradlew -p core exportTexts -Pout=$GITHUB_WORKSPACE/godot/daten/texte.json -q
          ./gradlew -p core exportHero -Pout=$GITHUB_WORKSPACE/godot/daten/held.json -q
          ./gradlew -p core exportIntro -Pout=$GITHUB_WORKSPACE/godot/daten/intro.json -q
          mkdir -p godot/daten/intro && for f in app/src/main/assets/intro/*.jpg app/src/main/assets/intro/*.png app/src/main/assets/tempel/*.jpg; do b=$(basename $f); cp $f godot/daten/intro/${b%.*}.bild; done
          cp godot/bilder/logo-quer.svg godot/daten/logo.bild
          ./gradlew -p core exportMapSheets -Pout=$GITHUB_WORKSPACE/godot/daten -q
          ./gradlew -p core exportThingArt -Pout=$GITHUB_WORKSPACE/godot/daten -q
          cp app/src/main/res/font/fondamento_regular.ttf godot/daten/fondamento.ttf
          cp app/src/main/assets/menu/hauptmenue.jpg godot/daten/hauptmenue.bild
      - name: Gekaufte Modelle (privat)
        env:
          GH_TOKEN: ${{ secrets.KAUF_TOKEN }}
        run: |
          echo "KAUF=$RUNNER_TEMP/kauf" >> $GITHUB_ENV
          timeout 1200 bash tools/blender348/kauf_laden.sh $RUNNER_TEMP/kauf > kauf.log 2>&1 || { tail -20 kauf.log; exit 1; }
          wc -l kauf.log
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: bl
          key: bpy-5.2.3-${{ runner.os }}-py${{ steps.py.outputs.python-version }}
      - name: Blender als Python-Modul
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          [ -x bl/bin/python ] || { rm -rf bl; python -m venv bl && bl/bin/pip -q install bpy==5.2.3 numpy pillow; }
      - uses: actions/cache@v4
        with:
          path: ~/cc0
          key: cc0-quaternius-4
      - name: CC0-Pakete (Quaternius)
        run: |
          [ -n "$(find ~/cc0 -name UAL1_Standard.glb 2>/dev/null)" ] || bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/medieval-village-megakit ] || PAKETE=medieval-village-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/stylized-nature-megakit ] || PAKETE=stylized-nature-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
          [ -d ~/cc0/fantasy-props-megakit ] || PAKETE=fantasy-props-megakit bash tools/blender348/v3/cc0_laden.sh ~/cc0
      - name: Held (wie godot.yml) und Kaempfer auf dem Kaufkoerper (376.1)
        run: |
          export OUT=$RUNNER_TEMP/out KARTEN=$GITHUB_WORKSPACE/godot/daten/karten.json
          for s in tex held3 rig; do
            bl/bin/python -I tools/blender348/v3/$s.py > $s.log 2>&1 || { tail -40 $s.log; exit 1; }
          done
          D=godot/daten
          cp $OUT/held.glb $D/held.bin && cp $OUT/held-info.json $D/
          ZIEL=$RUNNER_TEMP/klassen Q=~/cc0 KLASSEN=FIGHTER bl/bin/python -I tools/blender348/v3/held_klassen.py > klassen.log 2>&1 || { tail -40 klassen.log; exit 1; }
          grep -E "^KLASSE|HELD KLASSEN|FEHLT" klassen.log || true
          for f in $RUNNER_TEMP/klassen/held_*.glb; do cp $f $D/$(basename $f .glb).bin; done
          cp $RUNNER_TEMP/klassen/haare.glb $D/haare.bin && cp $RUNNER_TEMP/klassen/bewegungen.glb $D/bewegungen.bin && cp $RUNNER_TEMP/klassen/held-klassen.json $D/
          ls -l $D/held_*.bin $D/bewegungen.bin
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          ~/godot/godot --version
      - name: Messung (rennen_kauf_4164)
        run: |
          mkdir -p $GITHUB_WORKSPACE/probe
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          timeout 120 ~/godot/godot --headless --path . -s res://tests/skripte_pruefen.gd 2>&1 | grep -E "SKRIPTE|FALSCH|SCRIPT ERROR|Parse Error" | tee $GITHUB_WORKSPACE/probe/skripte.log || true
          set -o pipefail
          timeout 300 ~/godot/godot --headless --path . -s res://tests/rennen_kauf_4164.gd 2>&1 | grep -E "^(RENNEN|FEHLER)|SCRIPT ERROR|^ +at: " | cut -c1-600 | tee $GITHUB_WORKSPACE/probe/messung.log || true
          # 416.4 (Chef 20:3x Abbremsen in Stufen; Pruefer 4611 Stocken je Kachel): am echten Held (held.gd) im Dorf, Ergebnis in auslauf.log
          timeout 300 ~/godot/godot --headless --path . -s res://tests/rennen_auslauf_4164.gd 2>&1 | grep -E "^(AUSLAUF|FEHLER)|SCRIPT ERROR|^ +at: " | cut -c1-700 | tee $GITHUB_WORKSPACE/probe/auslauf.log || true
          # Pruefer 15:1x: Rennen -> Gehen springt; je Bild Neigung und groesste Knochendrehung um den Wechsel
          timeout 300 ~/godot/godot --headless --path . -s res://tests/rennen_wechsel_4164.gd 2>&1 | grep -E "^(WECHSEL|SCHLEIFE|BILD|FEHLER)|SCRIPT ERROR|^ +at: " | cut -c1-600 | tee $GITHUB_WORKSPACE/probe/wechsel.log
      - name: Film
        if: always() && inputs.film != 'nein'
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          command -v ffmpeg > /dev/null || { python3 -m pip install -q imageio-ffmpeg && mkdir -p ~/ffbin && ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/ffbin/ffmpeg; }
          export PATH=~/ffbin:$PATH
          mkdir -p $GITHUB_WORKSPACE/probe
          cd godot
          export HELDE="vorher|kauf:A|alt;weich (416.4)|kauf:A"   # 416.4 Uebergaenge (Chef 01.11., 13:1x), Rennen A
          timeout 900 xvfb-run -a -s "-screen 0 1080x2340x24" ~/godot/godot --rendering-driver opengl3 --path . --resolution 1080x2340 \
            --write-movie $RUNNER_TEMP/film.avi --fixed-fps 30 -s res://tests/rennen_film_4164.gd > $GITHUB_WORKSPACE/probe/film.log 2>&1 || true
          grep -E "^FILM|SCRIPT ERROR|^ +at: " $GITHUB_WORKSPACE/probe/film.log | cut -c1-400 | head -40
          ffmpeg -loglevel error -y -i $RUNNER_TEMP/film.avi -vf "scale=720:-2" -c:v libx264 -pix_fmt yuv420p -crf 24 -preset veryfast -movflags +faststart $GITHUB_WORKSPACE/probe/4164-rennen.mp4
          ffmpeg -loglevel error -y -ss 1 -i $GITHUB_WORKSPACE/probe/4164-rennen.mp4 -frames:v 1 $GITHUB_WORKSPACE/probe/4164-rennen.png
          ls -l $GITHUB_WORKSPACE/probe
          ! grep -qE "SCRIPT ERROR|FILM FEHLER" $GITHUB_WORKSPACE/probe/film.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bornim-probe-4164
          path: probe/
          if-no-files-found: ignore
