name: Tom Probe Laden (416.9)

# 416.9 (Chef 01.11., 11:30/11:32, Archiv 416.9): Laden mit fester Leiste „Angelegt“, ohne Leerzeile, Vergleich wie alt.
# Nur Oberflaeche, keine Modelle: Daten aus core, dann Tests laden_4169, tasten_4161, bedienung_test und die Bilder
# laden_bild_4169 (Verkaufen oben/unten, Stueck mit Vergleich, Menge). Ins Artefakt gehen nur Bilder und Protokolle.
# Nur bei Commits, die mit „416.9“ beginnen, oder von Hand.
on:
  push:
    branches: ["claude/spike-416-9-**", "claude/tom-416-9-**"]
    paths: ["godot/skripte/**", "godot/tests/laden_*", ".github/workflows/tom-probe-4169.yml"]
  workflow_dispatch:

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '416.9')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Karten und Texte aus core (wie godot.yml)
        run: |
          ./gradlew -p core exportMaps -Pout=$GITHUB_WORKSPACE/godot/daten/karten.json -q
          ./gradlew -p core exportTexts -Pout=$GITHUB_WORKSPACE/godot/daten/texte.json -q
          ./gradlew -p core exportHero -Pout=$GITHUB_WORKSPACE/godot/daten/held.json -q
          ./gradlew -p core exportIntro -Pout=$GITHUB_WORKSPACE/godot/daten/intro.json -q
          mkdir -p godot/daten/intro && for f in app/src/main/assets/intro/*.jpg app/src/main/assets/intro/*.png app/src/main/assets/tempel/*.jpg; do b=$(basename $f); cp $f godot/daten/intro/${b%.*}.bild; done
          cp godot/bilder/logo-quer.svg godot/daten/logo.bild
          ./gradlew -p core exportMapSheets -Pout=$GITHUB_WORKSPACE/godot/daten -q
          ./gradlew -p core exportThingArt -Pout=$GITHUB_WORKSPACE/godot/daten -q
          cp app/src/main/res/font/fondamento_regular.ttf godot/daten/fondamento.ttf
          cp app/src/main/assets/menu/hauptmenue.jpg godot/daten/hauptmenue.bild
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}
      - name: Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          [ -f godot ] || { curl -sSL -o g.zip $base/Godot_v$GODOT-stable_linux.x86_64.zip && unzip -q g.zip && mv Godot_v$GODOT-stable_linux.x86_64 godot && rm g.zip; }
          ~/godot/godot --version
      - name: Tests
        run: |
          mkdir -p $GITHUB_WORKSPACE/probe
          cd godot
          timeout 300 ~/godot/godot --headless --import --path . > import.log 2>&1 || true
          for t in skripte_pruefen laden_4169 tasten_4161 bedienung_test; do
            echo "== $t"
            timeout 180 ~/godot/godot --headless --path . -s res://tests/$t.gd > $GITHUB_WORKSPACE/probe/$t.log 2>&1; echo "EXIT $t $?" | tee -a $GITHUB_WORKSPACE/probe/exit.log
            grep -E "FEHLER|FALSCH|SCRIPT ERROR|Parse Error|^ +at: |LADEN4169|TASTEN|SKRIPTE|BEDIENUNG" $GITHUB_WORKSPACE/probe/$t.log | cut -c1-400 | head -40
          done
      - name: Bilder
        if: always()
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export OBERFLAECHE_AUS=$GITHUB_WORKSPACE/probe
          cd godot
          timeout 300 xvfb-run -a -s "-screen 0 1080x2340x24" ~/godot/godot --rendering-driver opengl3 --path . --resolution 1080x2340 \
            -s res://tests/laden_bild_4169.gd > $GITHUB_WORKSPACE/probe/bild.log 2>&1 || true
          grep -E "^BILD|SCRIPT ERROR|^ +at: " $GITHUB_WORKSPACE/probe/bild.log | cut -c1-400 | head -30
          ls -l $GITHUB_WORKSPACE/probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bornim-probe-4169
          path: probe/
          if-no-files-found: ignore
      - name: Ergebnis
        run: |
          cat probe/exit.log
          ! grep -E "EXIT (laden_4169|tasten_4161) [^0]" probe/exit.log
