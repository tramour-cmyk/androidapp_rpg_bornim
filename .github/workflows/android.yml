name: Build APK

# Builds an APK (artifact "bornim-apk") only for a pull request, a push to main, or by hand (78d): a branch is
# built once it is ready for a test round (open a PR or run the workflow by hand on the branch), not on every push.
# A release is published only on request (21.1): run this workflow by hand on main with "release" ticked, e.g.
#   gh workflow run android.yml --ref main -f release=true
# The AAB goes to the Play Console's internal test only by hand (142.1): run on main with "play" ticked.
on:
  push:
    branches: [main]
    # Pure documentation and tooling changes need no new APK.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Release veröffentlichen (nur auf main)"
        type: boolean
        default: false
      play:
        description: "AAB in den internen Test der Play Console (nur auf main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test game logic
        run: ./gradlew -p core test

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 is not set – the APK is signed with a temporary debug key and cannot be installed over earlier versions."
          fi

      # 142.1: the same build as an app bundle (AAB) for the Play Console, signed with the same upload key
      - name: Build APK and AAB
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease -PversionCode=$((${{ github.run_number }} + 1)) -PversionName=$VERSION_NAME
          cp app/build/outputs/apk/release/app-release.apk bornim.apk
          cp app/build/outputs/bundle/release/app-release.aab bornim.aab

      # The artifact ZIP stores the file's time without a zone, written as UTC (upload-artifact),
      # and the phone reads it as local time: shift the APK's time by Berlin's offset so it shows right.
      - name: Berlin time in the artifact
        run: |
          off=$(TZ=Europe/Berlin date +%z)
          secs=$(( ${off:0:1}1 * (10#${off:1:2} * 3600 + 10#${off:3:2} * 60) ))
          touch -d "@$(( $(date +%s) + secs ))" bornim.apk bornim.aab

      - uses: actions/upload-artifact@v4
        with:
          name: bornim-apk
          path: bornim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bornim-aab
          path: bornim.aab

      # 329: the key to the shortened names in a hang's stack (Hänger im Test-Reiter), kept with each build
      - uses: actions/upload-artifact@v4
        with:
          name: bornim-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # 142.1: service account key as secret PLAY_DIENSTKONTO (JSON); Google grants the right only hours after the invitation
      - name: Upload to Play (internal test)
        if: github.event_name == 'workflow_dispatch' && inputs.play && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_DIENSTKONTO }}
          packageName: de.bornim.game
          releaseFiles: bornim.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the "Unveröffentlicht" section of CHANGELOG.md, else the commit message.
          awk '/^## Unveröffentlicht/{on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md || true
          if ! grep -q '[^[:space:]]' notes.md; then git log -1 --pretty=%B > notes.md; fi
          echo -e "\n\n[Vollständige Änderungshistorie](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> notes.md
          gh release create "v$VERSION_NAME" bornim.apk \
            --title "Bornim $VERSION_NAME" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
